<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>OMP - android-replace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { width: 390px; height: 844px; overflow: hidden; background: #0F1115; }
button { font-family: 'Manrope', sans-serif; }
svg { flex-shrink: 0; }
</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0F1115; color: #E8EAF0; font-family: 'Manrope', sans-serif">
<div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.55)"></div>
<div role="dialog" aria-labelledby="rep-title" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 20px 16px 28px; border-radius: 20px 20px 0 0; background: #181B22; display: flex; flex-direction: column; gap: 12px">
<div style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #3A3F4B"></div>
<div id="rep-title" style="font-size: 20px; font-weight: 700">Заменить раздачу</div>
<div style="font-size: 13px; color: #9AA1B2">Starbound Frontier · Сезон 2</div>
<div style="padding: 12px; border-radius: 12px; background: #252A35; display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 12px; color: #9AA1B2">Сейчас</div>
<div style="font-size: 14px; font-weight: 700">Серии 1–8 из 10 · 1080p · 14,1 ГБ</div>
</div>
<div style="align-self: center; color: #9AA1B2" aria-hidden="true">↓</div>
<div style="padding: 12px; border-radius: 12px; background: #3A3320; display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 12px; color: #F5B700">Новая · rutor · 820 сидов</div>
<div style="font-size: 14px; font-weight: 700">Серии 1–10 из 10 · 1080p · 17,6 ГБ</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #C9CEDA; line-height: 1.4">
<div>✓ История просмотров и места остановки переносятся</div>
<div>✓ Настройки «Пропуск» и категория переносятся</div>
<div>✓ Старая раздача удаляется с сервера</div>
</div>
<button type="button" style="display: flex; align-items: center; height: 46px; padding: 0 14px; border: none; border-radius: 12px; background: #252A35; color: #E8EAF0; font-size: 14px; text-align: left">
<span style="flex-grow: 1">Другая раздача</span><span style="color: #9AA1B2">ещё 2 варианта ›</span>
</button>
<div style="display: flex; gap: 10px">
<button type="button" style="flex-grow: 1; height: 50px; border: none; border-radius: 12px; background: #252A35; color: #E8EAF0; font-size: 15px; font-weight: 700">Отмена</button>
<button type="button" style="flex-grow: 1; height: 50px; border: none; border-radius: 12px; background: #F5B700; color: #0F1115; font-size: 15px; font-weight: 700">Заменить</button>
</div>
</div>
</div>
</body>
</html>
