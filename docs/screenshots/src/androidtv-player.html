<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>OMP - android tv player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { width: 1280px; height: 720px; overflow: hidden; background: #05070B; }
</style>
</head>
<body>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: radial-gradient(ellipse at 70% 30%, #1C2740 0%, #0A0E17 45%, #030407 100%); color: #FFFFFF; font-family: 'Manrope', sans-serif">
<div style="position: absolute; top: 32px; right: 40px; padding: 10px 16px; border-radius: 10px; background: rgba(0,0,0,0.6); font-size: 16px; color: #C9CEDA">Управление с телефона</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 60px 64px 40px; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0.88)); display: flex; flex-direction: column; gap: 16px">
<div style="font-size: 30px; font-weight: 700">Starbound Frontier · S02E03 · Тишина в эфире</div>
<div style="position: relative; height: 10px; border-radius: 5px; background: rgba(255,255,255,0.25)"><div style="width: 48%; height: 10px; border-radius: 5px; background: #F5B700"></div></div>
<div style="display: flex; align-items: center; gap: 20px; font-size: 20px">
<span>23:14 / 48:32</span>
<span style="padding: 8px 18px; border-radius: 8px; background: #F5B700; color: #0F1115; font-weight: 700">Пауза</span>
<span style="padding: 8px 18px; border-radius: 8px; background: rgba(255,255,255,0.12)">Аудио: Русский · AC3 5.1</span>
<span style="padding: 8px 18px; border-radius: 8px; background: rgba(255,255,255,0.12)">Субтитры: Русские</span>
<span style="padding: 8px 18px; border-radius: 8px; background: rgba(255,255,255,0.12)">Следующая серия</span>
</div>
<div style="font-size: 17px; color: #9AA1B2">◀ ▶ перемотка · OK пауза · ▲ дорожки · Назад выход</div>
</div>
</div>
</body>
</html>
