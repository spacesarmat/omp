<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>OMP - androidtv-skip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { width: 1280px; height: 720px; overflow: hidden; background: #0F1115; }
button { font-family: 'Manrope', sans-serif; }
svg { flex-shrink: 0; }
</style>
</head>
<body>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #0F1115; color: #E8EAF0; font-family: 'Manrope', sans-serif">
<div style="padding: 44px 56px; display: flex; gap: 40px">
<div style="width: 220px; height: 320px; border-radius: 16px; flex-shrink: 0; background: linear-gradient(160deg, #2B3A55, #151A26)"></div>
<div style="display: flex; flex-direction: column; gap: 14px; flex-grow: 1; min-width: 0">
<div style="font-size: 36px; font-weight: 700">Starbound Frontier</div>
<div style="font-size: 20px; color: #9AA1B2">Сезон 2 · 8 серий · 18,0 GB</div>
<div style="display: flex; gap: 14px">
<button type="button" style="height: 56px; padding: 0 26px; border: none; border-radius: 14px; background: #F5B700; color: #0F1115; font-family: 'Manrope', sans-serif; font-size: 21px; font-weight: 700">Продолжить S02E03 с 23:14</button>
<button type="button" style="height: 56px; padding: 0 26px; border: none; border-radius: 14px; background: #252A35; color: #E8EAF0; font-family: 'Manrope', sans-serif; font-size: 21px; font-weight: 700">Серии</button>
</div>
<div style="margin-top: 10px; padding: 20px 22px; border-radius: 18px; background: #181B22; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: baseline; gap: 12px">
<span style="font-size: 24px; font-weight: 700">Пропуск</span>
<span style="font-size: 16px; color: #9AA1B2">для всех серий · общий для ТВ и телефона</span>
</div>
<button type="button" role="switch" aria-checked="true" style="display: flex; align-items: center; gap: 16px; height: 62px; padding: 0 16px; border: none; border-radius: 12px; background: #252A35; box-shadow: inset 0 0 0 3px #F5B700; color: #E8EAF0; font-family: 'Manrope', sans-serif; font-size: 21px; text-align: left">
<span style="flex-grow: 1">Пропускать заставку автоматически</span>
<span style="width: 56px; height: 32px; border-radius: 16px; background: #F5B700; position: relative"><span style="position: absolute; right: 4px; top: 4px; width: 24px; height: 24px; border-radius: 12px; background: #0F1115"></span></span>
</button>
<button type="button" role="switch" aria-checked="true" style="display: flex; align-items: center; gap: 16px; height: 62px; padding: 0 16px; border: none; border-radius: 12px; background: transparent; color: #E8EAF0; font-family: 'Manrope', sans-serif; font-size: 21px; text-align: left">
<span style="flex-grow: 1">Пропускать титры — сразу следующая серия</span>
<span style="width: 56px; height: 32px; border-radius: 16px; background: #F5B700; position: relative"><span style="position: absolute; right: 4px; top: 4px; width: 24px; height: 24px; border-radius: 12px; background: #0F1115"></span></span>
</button>
<button type="button" style="display: flex; align-items: center; gap: 16px; height: 62px; padding: 0 16px; border: none; border-radius: 12px; background: transparent; color: #E8EAF0; font-family: 'Manrope', sans-serif; font-size: 21px; text-align: left">
<span style="flex-grow: 1">Заставка и титры</span>
<span style="color: #9AA1B2; font-size: 19px">по главам файла · заставка 0:45–2:15 ›</span>
</button>
</div>
</div>
</div>
</div>
</body>
</html>
