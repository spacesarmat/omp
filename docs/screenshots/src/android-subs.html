<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>OMP - android-subs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { width: 390px; height: 844px; overflow: hidden; background: #0F1115; }
button { font-family: 'Manrope', sans-serif; }
svg { flex-shrink: 0; }
</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0F1115; color: #E8EAF0; font-family: 'Manrope', sans-serif">
<div style="padding: 52px 16px 0; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 8px"><span style="font-size: 26px; font-weight: 700; flex-grow: 1">Новое</span><button type="button" style="height: 40px; padding: 0 12px; border: none; border-radius: 12px; background: #181B22; color: #E8EAF0; font-size: 13px; font-weight: 700">Проверить сейчас</button></div>
<div role="tablist" style="display: flex; padding: 4px; border-radius: 14px; background: #181B22"><button type="button" role="tab" aria-selected="false" style="flex-grow: 1; height: 40px; border: none; border-radius: 10px; background: none; color: #9AA1B2; font-size: 14px; font-weight: 600">Лента</button><button type="button" role="tab" aria-selected="true" style="flex-grow: 1; height: 40px; border: none; border-radius: 10px; background: #252A35; color: #E8EAF0; font-size: 14px; font-weight: 700">Подписки · 3 новых</button></div>
<div style="font-size: 12px; color: #9AA1B2">Проверено в 14:20 · следующая проверка около 17:20</div>
<div style="font-size: 12px; color: #9AA1B2; text-transform: uppercase; letter-spacing: 0.06em">Подписки</div>
<button type="button" style="display: flex; align-items: center; gap: 10px; padding: 12px; border: none; border-radius: 14px; background: #181B22; color: #E8EAF0; text-align: left"><span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: 700">Дюна 2160p</span><span style="font-size: 12px; color: #9AA1B2">Все источники · от 2160p · от 20 сидов</span></span><span style="padding: 4px 10px; border-radius: 10px; background: #F5B700; color: #0F1115; font-size: 12px; font-weight: 700">2 новых</span></button>
<button type="button" style="display: flex; align-items: center; gap: 10px; padding: 12px; border: none; border-radius: 14px; background: #181B22; color: #E8EAF0; text-align: left"><span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: 700">Северный ветер сезон 2</span><span style="font-size: 12px; color: #9AA1B2">rutor, nnmclub · от 1080p</span></span><span style="padding: 4px 10px; border-radius: 10px; background: #F5B700; color: #0F1115; font-size: 12px; font-weight: 700">1 новая</span></button>
<button type="button" style="display: flex; align-items: center; gap: 10px; padding: 12px; border: none; border-radius: 14px; background: #181B22; color: #E8EAF0; text-align: left"><span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: 700">Песчаный город</span><span style="font-size: 12px; color: #9AA1B2">Все источники · любое качество</span></span></button>
<button type="button" style="height: 46px; border: 1px dashed #3A3F4B; border-radius: 14px; background: none; color: #C9CEDA; font-size: 14px; font-weight: 700">+ Новая подписка</button>
<div style="font-size: 12px; color: #9AA1B2; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 4px">Новые серии сериалов из каталога</div>
<div style="display: flex; gap: 12px; padding: 10px; border-radius: 14px; background: #181B22"><span style="width: 44px; height: 62px; border-radius: 8px; flex-shrink: 0; background: linear-gradient(160deg, #2B3A55, #151A26)"></span>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0; flex-grow: 1"><div style="font-size: 14px; font-weight: 700">Starbound Frontier · Сезон 2</div><div style="font-size: 12px; color: #F5B700">Вышли серии 9–10 · у вас 1–8</div>
<div style="display: flex; gap: 8px"><button type="button" style="height: 34px; padding: 0 12px; border: none; border-radius: 10px; background: #F5B700; color: #0F1115; font-size: 13px; font-weight: 700">Заменить…</button><button type="button" style="height: 34px; padding: 0 12px; border: none; border-radius: 10px; background: #252A35; color: #E8EAF0; font-size: 13px; font-weight: 600">Не следить</button></div></div></div>
<div style="font-size: 12px; color: #9AA1B2; line-height: 1.4">Сериалы из каталога проверяются сами; выключить можно в карточке сериала или здесь.</div>
</div>
<div style="position: absolute; left: 0; bottom: 0"><nav aria-label="Разделы" style="width: 390px; height: 80px; padding: 8px 4px 14px; display: flex; background: #14161C; border-top: 1px solid #252A35; font-family: 'Manrope', sans-serif">
<button type="button" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 6px; border: none; background: none; font-size: 11px; font-weight: 600; position: relative; color: #9AA1B2"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 30px; border-radius: 15px; position: relative; "><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"></path></svg></span>Каталог</button>
<button type="button" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 6px; border: none; background: none; font-size: 11px; font-weight: 600; position: relative; color: #E8EAF0"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 30px; border-radius: 15px; position: relative; background: #3A3320; color: #F5B700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"></path></svg><span style="position: absolute; top: 0; right: 8px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: #F5B700; color: #0F1115; font-size: 10px; font-weight: 700; line-height: 16px; text-align: center">3</span></span>Новое</button>
<button type="button" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 6px; border: none; background: none; font-size: 11px; font-weight: 600; position: relative; color: #9AA1B2"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 30px; border-radius: 15px; position: relative; "><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>Добавить</button>
<button type="button" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 6px; border: none; background: none; font-size: 11px; font-weight: 600; position: relative; color: #9AA1B2"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 30px; border-radius: 15px; position: relative; "><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2h8a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zM12 7a2 2 0 1 0 0 4a2 2 0 1 0 0-4M10 16h4"></path></svg></span>Пульт</button>
<button type="button" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 6px; border: none; background: none; font-size: 11px; font-weight: 600; position: relative; color: #9AA1B2"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 30px; border-radius: 15px; position: relative; "><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8M14 7a2 2 0 1 0 4 0a2 2 0 1 0-4 0M8 17a2 2 0 1 0 4 0a2 2 0 1 0-4 0"></path></svg></span>Настройки</button>
</nav></div>
</div>
</body>
</html>
