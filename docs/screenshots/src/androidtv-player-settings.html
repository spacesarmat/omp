<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>OMP — выбор плеера на ТВ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { width: 1280px; height: 720px; overflow: hidden; background: #0F1115; }
button { font-family: 'Manrope', sans-serif; }
svg { flex-shrink: 0; }
</style>
</head>
<body>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #0F1115; color: #E8EAF0; font-family: 'Manrope', sans-serif">
<div style="padding: 40px 56px; display: flex; gap: 40px">
<div style="width: 320px; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 32px; font-weight: 700; margin-bottom: 14px">Настройки</div>

<div style="height: 52px; padding: 0 18px; border-radius: 14px; display: flex; align-items: center; font-size: 19px; background: #181B22; color: #C9CEDA">Серверы</div>

<div style="height: 52px; padding: 0 18px; border-radius: 14px; display: flex; align-items: center; font-size: 19px; background: #181B22; color: #C9CEDA">Источники поиска</div>

<div style="height: 52px; padding: 0 18px; border-radius: 14px; display: flex; align-items: center; font-size: 19px; background: #252A35; color: #E8EAF0; box-shadow: inset 0 0 0 3px #F5B700">Плеер</div>

<div style="height: 52px; padding: 0 18px; border-radius: 14px; display: flex; align-items: center; font-size: 19px; background: #181B22; color: #C9CEDA">Пропуск заставки</div>

<div style="height: 52px; padding: 0 18px; border-radius: 14px; display: flex; align-items: center; font-size: 19px; background: #181B22; color: #C9CEDA">Журнал</div>

<div style="height: 52px; padding: 0 18px; border-radius: 14px; display: flex; align-items: center; font-size: 19px; background: #181B22; color: #C9CEDA">О приложении</div>

</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 24px; font-weight: 700">Плеер</div>
<div style="font-size: 17px; color: #9AA1B2; line-height: 1.45">Чем показывать видео на этом телевизоре.</div>

<button type="button" role="radio" aria-checked="true" style="display: flex; align-items: center; gap: 16px; padding: 16px 18px; border: none; border-radius: 14px; color: #E8EAF0; font-family: 'Manrope', sans-serif; text-align: left; background: #252A35; box-shadow: inset 0 0 0 3px #F5B700">
<span style="width: 22px; height: 22px; border-radius: 11px; flex-shrink: 0; background: #F5B700; box-shadow: inset 0 0 0 5px #252A35"></span>
<span style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 20px; font-weight: 700">Авто</span>
<span style="font-size: 15px; color: #9AA1B2; line-height: 1.4">Встроенный плеер; если он не может открыть файл или в нём субтитры ASS — VLC с того же места</span>
</span>
</button>

<button type="button" role="radio" aria-checked="false" style="display: flex; align-items: center; gap: 16px; padding: 16px 18px; border: none; border-radius: 14px; color: #E8EAF0; font-family: 'Manrope', sans-serif; text-align: left; background: #181B22">
<span style="width: 22px; height: 22px; border-radius: 11px; flex-shrink: 0; box-shadow: inset 0 0 0 2px #6B7280"></span>
<span style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 20px; font-weight: 700">Встроенный</span>
<span style="font-size: 15px; color: #9AA1B2; line-height: 1.4">Плеер Android с декодером FFmpeg: DTS, AC3 и TrueHD без поддержки приставки</span>
</span>
</button>

<button type="button" role="radio" aria-checked="false" style="display: flex; align-items: center; gap: 16px; padding: 16px 18px; border: none; border-radius: 14px; color: #E8EAF0; font-family: 'Manrope', sans-serif; text-align: left; background: #181B22">
<span style="width: 22px; height: 22px; border-radius: 11px; flex-shrink: 0; box-shadow: inset 0 0 0 2px #6B7280"></span>
<span style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 20px; font-weight: 700">VLC</span>
<span style="font-size: 15px; color: #9AA1B2; line-height: 1.4">Почти все форматы и субтитры ASS со стилями; чуть дольше открывает файл</span>
</span>
</button>

<div style="font-size: 15px; color: #9AA1B2; margin-top: 6px">Для отдельной раздачи плеер меняется в меню плеера — «Сменить плеер».</div>
</div>
</div>
</div>
</body>
</html>
