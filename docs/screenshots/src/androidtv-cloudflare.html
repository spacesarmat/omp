<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>OMP — проверка Cloudflare на ТВ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { width: 1280px; height: 720px; overflow: hidden; background: #0F1115; }
button { font-family: 'Manrope', sans-serif; }
svg { flex-shrink: 0; }
</style>
</head>
<body>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #0F1115; color: #E8EAF0; font-family: 'Manrope', sans-serif">
<div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(8,10,14,0.7)"></div>
<div style="position: absolute; top: 70px; left: 140px; width: 1000px; height: 580px; border-radius: 20px; background: #181B22; display: flex; flex-direction: column; overflow: hidden">
<div style="padding: 22px 28px; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 26px; font-weight: 700">rustorka: проверка Cloudflare</div>
<div style="font-size: 17px; color: #9AA1B2">Сайт просит подтвердить, что вы не робот. Пультом это неудобно — пройдите проверку на телефоне.</div>
</div>
<div style="margin: 0 28px; flex-grow: 1; border-radius: 14px; background: #FFFFFF; color: #1F2328; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px">
<div style="font-size: 22px; font-weight: 600">rustorka.example</div>
<div style="font-size: 17px; color: #59636E">Verify you are human by completing the action below.</div>
<div style="width: 300px; height: 64px; border: 1px solid #D0D7DE; border-radius: 6px; display: flex; align-items: center; gap: 14px; padding: 0 16px; box-sizing: border-box">
<span style="width: 26px; height: 26px; border: 2px solid #8C959F; border-radius: 4px"></span>
<span style="font-size: 16px">Verify you are human</span>
</div>
</div>
<div style="padding: 20px 28px; display: flex; gap: 14px">
<button type="button" style="height: 56px; padding: 0 28px; border: none; border-radius: 14px; background: #F5B700; color: #0F1115; font-family: 'Manrope', sans-serif; font-size: 19px; font-weight: 700; box-shadow: 0 0 0 3px #0F1115, 0 0 0 6px #F5B700">Пройти на телефоне</button>
<button type="button" style="height: 56px; padding: 0 28px; border: none; border-radius: 14px; background: #252A35; color: #E8EAF0; font-family: 'Manrope', sans-serif; font-size: 19px; font-weight: 700">Отметить пультом</button>
<button type="button" style="height: 56px; padding: 0 28px; border: none; border-radius: 14px; background: #252A35; color: #E8EAF0; font-family: 'Manrope', sans-serif; font-size: 19px; font-weight: 700">Отмена</button>
<span style="align-self: center; font-size: 15px; color: #9AA1B2; margin-left: 8px">Телефон «Pixel 8» получит запрос</span>
</div>
</div>
</div>
</body>
</html>
