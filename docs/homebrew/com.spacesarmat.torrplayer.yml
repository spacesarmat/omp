description: |
  # OMP — Open Movie Player

  A remote-friendly media player for LG webOS that streams from **your own
  [TorrServer](https://github.com/YouROK/TorrServer)** instance on the local network.
  OMP does not include any trackers, catalogs or content sources — it only plays
  what you have already added to your server.

  ![Library](https://raw.githubusercontent.com/spacesarmat/omp/main/docs/screenshots/library-large.png)

  ## Features
  - Connect to TorrServer (auto-discovery on the LAN, saved servers with credentials)
  - Library with poster/list views, history (continue watching), search and sort
  - Native `<video>` playback: audio/subtitle tracks, external subtitles, chapters, skip intro
  - M3U playlists and favorites
  - Update check with one-click install via Homebrew Channel on rooted TVs
  - Russian UI; works on webOS 4.0+ (no root required)

  Source code: https://github.com/spacesarmat/omp
