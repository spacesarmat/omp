// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.1'
        classpath 'com.google.gms:google-services:4.4.4'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.20'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// player-core pulls smbj-rpc (dcerpc), which requests commons-io 2.7 and commons-lang3 3.4
// (CVE-2024-47554 / GHSA-78wr-2p64-hpwj, CVE-2025-48924 / GHSA-j288-q9x7-2f5v).
// 2160 Player v0.2.17 does not force the patched releases. OMP does, for every module in this build.
subprojects {
    configurations.configureEach {
        resolutionStrategy {
            force 'commons-io:commons-io:2.18.0', 'org.apache.commons:commons-lang3:3.18.0'
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
