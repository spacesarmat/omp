apply plugin: 'com.android.application'
// Kotlin: built into AGP 9 (the org.jetbrains.kotlin.android plugin is no longer applied)

// version comes from the root package.json: versionCode = major*10000 + minor*100 + patch
def pkg = new groovy.json.JsonSlurper().parse(file('../../package.json'))
def (vMajor, vMinor, vPatch) = pkg.version.tokenize('.-')[0..2].collect { it as int }

android {
    namespace = "com.spacesarmat.omp"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.spacesarmat.omp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode vMajor * 10000 + vMinor * 100 + vPatch
        versionName pkg.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    androidResources {
        // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
        // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
    signingConfigs {
        release {
            def ks = System.getenv('ANDROID_KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    // Per-ABI APKs (OMP-x.y.z-arm64.apk, OMP-x.y.z-armv7.apk) plus the universal one (OMP-x.y.z.apk, both ABIs).
    // Every split keeps the same versionCode (major*10000 + minor*100 + patch): OMP is sideloaded only (no Play
    // Store), so any split installs over any earlier install of a lower version, and over the same version too.
    // The embedded TorrServer is not packed into any APK: the app downloads the pinned arm64 binary on demand
    // (res/raw/torrserver.json, see LocalTorrServer / TorrServerBinary), on any arm64 phone whatever the split.
    splits {
        abi {
            enable = true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk = true
        }
    }
    // the universal APK carries only the two ARM ABIs (libVLC also ships x86/x86_64 libraries)
    packaging {
        jniLibs {
            excludes += ['lib/x86/**', 'lib/x86_64/**']
            // nextlib-media3ext and nextlib-mediainfo (player-core) both ship the FFmpeg shared libraries
            pickFirsts += ['**/libavcodec.so', '**/libavutil.so', '**/libswscale.so', '**/libswresample.so']
        }
    }
    buildTypes {
        // test builds install next to the released app (different package, its own data) for device checks
        debug {
            applicationIdSuffix '.test'
            versionNameSuffix '-test'
        }
        release {
            if (System.getenv('ANDROID_KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            } else {
                gradle.taskGraph.whenReady { graph ->
                    if (graph.allTasks.any { it.name.toLowerCase().contains('release') && it.project == project }) {
                        throw new GradleException('Нет ключа подписи Android (переменные ANDROID_KEYSTORE_FILE и др.)')
                    }
                }
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // monitoring: background checks (monitor/MonitorWorker.kt) in a hidden WebView served from the APK assets
    implementation 'androidx.work:work-runtime-ktx:2.10.3'
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    // native player on Android TV (player/PlayerActivity.kt)
    // Media3 is aligned with 2160 Player's player-core (it exposes media3-exoplayer as api), see the version
    // catalog in vendor/2160player/gradle/libs.versions.toml
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
    // FFmpeg audio decoders for Media3 (DTS, AC3/E-AC3, TrueHD…) when the box has no hardware decoder; enabled in
    // v0.15 Task 3. nextlib (GPL-3.0, compatible with OMP's GPL-3.0), the same build player-core uses; it must be a
    // direct dependency because player-core has it as implementation. Its version follows Media3 (1.11.1-x).
    implementation 'io.github.anilbeesetti:nextlib-media3ext:1.11.1-0.16.0'
    // 2160 Player engine (experimental, exp/2160-engine): built from the submodule through includeBuild in
    // settings.gradle, which substitutes this coordinate with project(':player-core')
    implementation 'tv.p2160:player-core:0.1.0'
    // second player engine on Android TV (LGPL-2.1), used from v0.15 Task 4
    implementation 'org.videolan.android:libvlc-all:3.7.7'
    // install assistant: LG Developer Mode over SSH (BSD-3-Clause) and Android TV over adb (Apache-2.0), see install/
    implementation 'com.github.mwiede:jsch:2.28.7'
    implementation 'dev.mobile:dadb:2.0.0'
    testImplementation "junit:junit:$junitVersion"
    // real org.json for the control router tests (android.jar only has stubs)
    testImplementation "org.json:json:20240303"
    // local HTTP server for the release download redirect tests (install/OkReleaseHttpTest)
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

android.packaging.jniLibs.useLegacyPackaging = true

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
