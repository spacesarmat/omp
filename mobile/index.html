<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0F1115">
  <title>OMP</title>
  <!-- The bundle boots for a moment before the app paints: the brand screen is inline so it is there from the
       first frame. mobile/src/bootScreen.ts removes it once the app has rendered. -->
  <style>
    html { background: #0F1115; }
    #omp-boot { position: fixed; left: 0; right: 0; top: 0; bottom: 0; background: #0F1115; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #omp-boot b { margin-top: 18px; font: 800 22px/1 'Unbounded', 'Manrope', Arial, sans-serif; letter-spacing: 4px; color: #E8EAF0; }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Web fonts must never hold the first paint back (the host is unreachable on some networks): the sheet loads
       non-blocking, the boot screen and the app use the system font until it arrives. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Unbounded:wght@500;600&display=swap" media="print" onload="this.media='all'">
</head>
<body>
  <div id="app"></div>
  <div id="omp-boot" aria-hidden="true">
    <svg width="112" height="112" viewBox="0 0 100 100">
      <rect x="14" y="22" width="72" height="56" rx="10" fill="none" stroke="#F5B700" stroke-width="7"/>
      <g fill="#F5B700">
        <rect x="23" y="29" width="6" height="5" rx="1.5"/><rect x="35" y="29" width="6" height="5" rx="1.5"/><rect x="47" y="29" width="6" height="5" rx="1.5"/><rect x="59" y="29" width="6" height="5" rx="1.5"/><rect x="71" y="29" width="6" height="5" rx="1.5"/>
        <rect x="23" y="66" width="6" height="5" rx="1.5"/><rect x="35" y="66" width="6" height="5" rx="1.5"/><rect x="47" y="66" width="6" height="5" rx="1.5"/><rect x="59" y="66" width="6" height="5" rx="1.5"/><rect x="71" y="66" width="6" height="5" rx="1.5"/>
      </g>
      <path d="M44 41 L59 50 L44 59 Z" fill="#E8EAF0" stroke="#E8EAF0" stroke-width="4" stroke-linejoin="round"/>
    </svg>
    <b>OMP</b>
  </div>
  <script type="module" src="./src/main.tsx"></script>
</body>
</html>
