# Custom app for ZimaOS / CasaOS. Uses the Jackett already on the NAS (port 9117).
# Install:
#   1. Copy ops/billing → /DATA/AppData/omp-billing/app
#   2. Put CLOUDFLARE_TUNNEL_TOKEN into /DATA/AppData/omp-billing/.env (see README)
#   3. casaos-cli app-management install -f /DATA/AppData/omp-billing/docker-compose.yml
#      or: docker compose -f /DATA/AppData/omp-billing/app/docker-compose.yml --env-file /DATA/AppData/omp-billing/.env up -d
name: omp-billing
services:
  omp-billing:
    cpu_shares: 90
    container_name: omp-billing
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 64M
    environment:
      PORT: "8787"
      BILLING_DATA: /data/billing.db
      # host gateway on Docker bridge — existing Jackett on the NAS
      BILLING_JACKETT_URL: http://host.docker.internal:9117
      TZ: Europe/Moscow
    image: node:24-bookworm-slim
    working_dir: /app
    command:
      - /app/start.sh
    labels:
      icon: https://cdn.jsdelivr.net/gh/spacesarmat/omp@refactor/code/assets/icon.svg
    network_mode: bridge
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - target: 8787
        published: "8787"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/omp-billing/app
        target: /app
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/AppData/omp-billing/data
        target: /data
        bind:
          create_host_path: true

  # Public HTTPS via Cloudflare Tunnel. Config (hostname → URL) lives in Zero Trust UI.
  # Service URL in the dashboard: http://127.0.0.1:8787
  # Start: docker compose --profile tunnel --env-file /DATA/AppData/omp-billing/.env up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: omp-billing-tunnel
    profiles:
      - tunnel
    restart: unless-stopped
    network_mode: service:omp-billing
    depends_on:
      - omp-billing
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    command:
      - tunnel
      - --no-autoupdate
      - --protocol
      - http2
      - run
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

  # Temporary free HTTPS (random https://….trycloudflare.com). URL changes on recreate.
  # Start: docker compose --profile quick up -d
  cloudflared-quick:
    image: cloudflare/cloudflared:latest
    container_name: omp-billing-quick
    profiles:
      - quick
    restart: unless-stopped
    network_mode: service:omp-billing
    depends_on:
      - omp-billing
    # Note: on this NAS quick tunnels often return CF 530; named tunnel + own domain is preferred.
    # Fallback used in practice: cloudflared --url on a LAN PC proxying to :8787.
    command:
      - tunnel
      - --no-autoupdate
      - --protocol
      - http2
      - --url
      - http://127.0.0.1:8787
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

x-casaos:
  architectures:
    - amd64
    - arm64
  author: spacesarmat
  category: Networking
  description:
    en_US: OMP subscription admin panel and Jackett search proxy. Jackett stays on the NAS; phones only talk to this API.
    ru_RU: Админ-панель подписок OMP и прокси поиска в Jackett. Jackett остаётся на NAS; телефон ходит только в этот API.
  developer: OMP
  hostname: ""
  icon: https://cdn.jsdelivr.net/gh/spacesarmat/omp@refactor/code/assets/icon.svg
  id: com.spacesarmat.omp-billing
  index: /admin
  is_uncontrolled: false
  main: omp-billing
  port_map: "8787"
  scheme: http
  store_app_id: omp-billing
  tagline:
    en_US: OMP paid Jackett access
    ru_RU: Платный Jackett для OMP
  title:
    custom: OMP Billing
    en_US: OMP Billing
    ru_RU: OMP Billing
  version: 0.20.0
  update_at: "2026-10-14"
