# Custom app for ZimaOS / CasaOS. Uses the Jackett already on the NAS (port 9117).
# Install: copy ops/billing into /DATA/AppData/omp-billing/app, then import this compose
# or: docker compose -f casaos-docker-compose.yml up -d
name: omp-billing
services:
  omp-billing:
    cpu_shares: 90
    container_name: omp-billing
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 64M
    environment:
      PORT: "8787"
      BILLING_DATA: /data/state.json
      # host gateway on Docker bridge — existing Jackett on the NAS
      BILLING_JACKETT_URL: http://host.docker.internal:9117
      TZ: Europe/Moscow
    image: node:24-bookworm-slim
    working_dir: /app
    command:
      - /app/start.sh
    network_mode: bridge
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - target: 8787
        published: "8787"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/omp-billing/app
        target: /app
      - type: bind
        source: /DATA/AppData/omp-billing/data
        target: /data
x-casaos:
  architectures:
    - amd64
    - arm64
  author: OMP
  category: Network
  description:
    en_us: OMP subscription panel and Jackett search proxy. Jackett stays on the NAS; phones only talk to this API.
    ru_ru: Панель подписок OMP и прокси поиска в Jackett. Jackett остаётся на NAS; телефон ходит только в этот API.
  developer: OMP
  hostname: ""
  icon: ""
  id: com.spacesarmat.omp-billing
  index: /admin
  is_uncontrolled: true
  main: omp-billing
  port_map: "8787"
  scheme: http
  store_app_id: omp-billing
  tagline:
    en_us: OMP paid Jackett access
    ru_ru: Платный Jackett для OMP
  title:
    custom: OMP Billing
    en_us: OMP Billing
