# OMP VPS stack: Caddy + billing + Jackett + JacRed + TorrServer + FlareSolverr
# Jackett FlareSolverrUrl = http://flaresolverr:8191/ (timeout 55000); HTTP proxy warp:1080
# Deploy: copy this directory to the VPS, fill .env, then:
#   docker compose pull && docker compose up -d
#
# Billing image is built by CI and pushed to GHCR (see .github/workflows/billing-image.yml).

name: omp-vps

services:
  caddy:
    image: caddy:2-alpine
    container_name: omp-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@omp-player.online}
      INDEXER_USER: ${INDEXER_USER:-omp}
      # Required: bcrypt hash from .env (never commit real .env). See .env.example.
      # $$ → literal $ in the bcrypt hash for Caddy when the value is inlined.
      INDEXER_HASH: ${INDEXER_HASH:?Set INDEXER_HASH in .env - see .env.example}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - billing
      - jackett
      - jacred
    networks:
      - omp

  billing:
    image: ${BILLING_IMAGE:-ghcr.io/spacesarmat/omp-billing:latest}
    container_name: omp-billing
    restart: unless-stopped
    environment:
      PORT: "8787"
      BILLING_HOST: "0.0.0.0"
      BILLING_DATA: /data/billing.db
      BILLING_PUBLIC_ORIGIN: ${BILLING_PUBLIC_ORIGIN:-https://billing.omp-player.online}
      # Only this container may call getUpdates. Other copies set BILLING_BOT_POLL=0.
      BILLING_BOT_POLL: ${BILLING_BOT_POLL:-1}
      BILLING_JACKETT_URL: http://jackett:9117
      BILLING_JACRED_URL: http://jacred:9117
      BILLING_TORRSERVER_URL: http://torrserver:8090
      # Fan-out search: 12s per indexer, 18s for the whole /v1/search.
      BILLING_JACKETT_INDEXER_TIMEOUT_MS: "12000"
      BILLING_JACKETT_SEARCH_DEADLINE_MS: "18000"
      # /v1/activate limits per window (0 = off). See ops/billing/README.md.
      BILLING_ACTIVATE_IP_MAX: ${BILLING_ACTIVATE_IP_MAX:-20}
      BILLING_ACTIVATE_CODE_MAX: ${BILLING_ACTIVATE_CODE_MAX:-10}
      BILLING_ACTIVATE_WINDOW_SEC: ${BILLING_ACTIVATE_WINDOW_SEC:-600}
      BILLING_LINK_CLEAR_REQUIRE_TOKEN: ${BILLING_LINK_CLEAR_REQUIRE_TOKEN:-0}
      # HMAC key for device access tokens (set in .env, 32+ chars; empty = key kept in billing.db).
      BILLING_TOKEN_SECRET: ${BILLING_TOKEN_SECRET:-}
      # Secrets live only in .env (the panel shows them read-only): bot token, YooMoney secret, SMTP password,
      # indexer keys. Empty = the old value in the database settings is used until it is moved.
      BILLING_BOT_TOKEN: ${BILLING_BOT_TOKEN:-}
      BILLING_YOOMONEY_SECRET: ${BILLING_YOOMONEY_SECRET:-}
      BILLING_SMTP_PASS: ${BILLING_SMTP_PASS:-}
      BILLING_JACKETT_API_KEY: ${BILLING_JACKETT_API_KEY:-}
      BILLING_JACRED_API_KEY: ${BILLING_JACRED_API_KEY:-}
      BILLING_INDEXER_PASS: ${BILLING_INDEXER_PASS:-}
      # 0 = refuse the old long-lived device tokens (apps before the token update). Leave 1 for now.
      BILLING_LEGACY_TOKENS: ${BILLING_LEGACY_TOKENS:-1}
      TZ: ${TZ:-Europe/Moscow}
      # Datacenter IPs often cannot reach api.telegram.org — route bot via WARP HTTP proxy
      HTTP_PROXY: http://warp:1080
      HTTPS_PROXY: http://warp:1080
      NO_PROXY: jackett,jacred,torrserver,caddy,localhost,127.0.0.1
      NODE_USE_ENV_PROXY: "1"
    volumes:
      - ./data/billing:/data
    depends_on:
      - jackett
      - jacred
      - warp
    networks:
      - omp
    # not published — only Caddy reaches it

  # SOCKS/HTTP proxy so billing can reach Telegram Bot API from a blocked VPS IP
  warp:
    image: caomingjun/warp:latest
    container_name: omp-warp
    restart: unless-stopped
    environment:
      WARP_SLEEP: "2"
    cap_add:
      - NET_ADMIN
      - MKNOD
      - AUDIT_WRITE
    device_cgroup_rules:
      - "c 10:200 rwm"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - ./data/warp:/var/lib/cloudflare-warp
    networks:
      - omp

  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: omp-jackett
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-Europe/Moscow}
      AUTO_UPDATE: "true"
    volumes:
      - ./data/jackett:/config
    networks:
      - omp

  jacred:
    image: ghcr.io/jacred-fdb/jacred:latest
    container_name: omp-jacred
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Moscow}
      ASPNETCORE_URLS: http://0.0.0.0:9117
    volumes:
      - ./jacred/init.yaml:/app/config/init.yaml:ro
      - ./data/jacred:/app/Data
    depends_on:
      - torrserver
    networks:
      - omp

  torrserver:
    image: ghcr.io/yourok/torrserver:latest
    container_name: omp-torrserver
    restart: unless-stopped
    environment:
      TS_PORT: "8090"
      TS_DONTKILL: "1"
      TS_HTTPAUTH: "0"
      TS_CONF_PATH: /opt/ts/config
      TS_TORR_DIR: /opt/ts/torrents
    volumes:
      - ./data/torrserver/config:/opt/ts/config
      - ./data/torrserver/torrents:/opt/ts/torrents
    networks:
      - omp

  # Cloudflare challenge solver for Jackett/JacRed indexers. Localhost-only publish.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: omp-flaresolverr
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      TZ: Europe/Moscow
    ports:
      - "127.0.0.1:8191:8191"
    networks:
      - omp

networks:
  omp:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
