# OMP VPS stack: Caddy + billing + Jackett + JacRed + TorrServer + FlareSolverr + read-only Docker API proxy
# Jackett FlareSolverrUrl = http://flaresolverr:8191/ (timeout 55000); HTTP proxy warp:1080
# Deploy: copy this directory to the VPS, fill .env, then:
#   docker compose pull && docker compose up -d
#
# Billing image is built by CI and pushed to GHCR (see .github/workflows/billing-image.yml).

name: omp-vps

services:
  caddy:
    image: caddy:2-alpine@sha256:8652f54d3ef21e120f78f3c6b396bcf7d3fc8f999cece30cd35490430da89430
    container_name: omp-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@omp-player.online}
      INDEXER_USER: ${INDEXER_USER:-omp}
      # Required: bcrypt hash from .env (never commit real .env). See .env.example.
      # $$ → literal $ in the bcrypt hash for Caddy when the value is inlined.
      INDEXER_HASH: ${INDEXER_HASH:?Set INDEXER_HASH in .env - see .env.example}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - billing
      - jackett
      - jacred
    networks:
      - omp

  billing:
    image: ${BILLING_IMAGE:-ghcr.io/spacesarmat/omp-billing:latest}
    container_name: omp-billing
    restart: unless-stopped
    environment:
      PORT: "8787"
      BILLING_HOST: "0.0.0.0"
      BILLING_DATA: /data/billing.db
      BILLING_PUBLIC_ORIGIN: ${BILLING_PUBLIC_ORIGIN:-https://billing.omp-player.online}
      # Only this container may call getUpdates. Other copies set BILLING_BOT_POLL=0.
      BILLING_BOT_POLL: ${BILLING_BOT_POLL:-1}
      BILLING_JACKETT_URL: http://jackett:9117
      BILLING_JACRED_URL: http://jacred:9117
      BILLING_TORRSERVER_URL: http://torrserver:8090
      # Fan-out search: 12s per indexer, 18s for the whole /v1/search.
      BILLING_JACKETT_INDEXER_TIMEOUT_MS: "12000"
      BILLING_JACKETT_SEARCH_DEADLINE_MS: "18000"
      # /v1/activate limits per window (0 = off). See ops/billing/README.md.
      BILLING_ACTIVATE_IP_MAX: ${BILLING_ACTIVATE_IP_MAX:-20}
      BILLING_ACTIVATE_CODE_MAX: ${BILLING_ACTIVATE_CODE_MAX:-10}
      BILLING_ACTIVATE_WINDOW_SEC: ${BILLING_ACTIVATE_WINDOW_SEC:-600}
      # POST /v1/link/claim per window (0 = off). The device must already be linked by the bot.
      BILLING_CLAIM_IP_MAX: ${BILLING_CLAIM_IP_MAX:-30}
      BILLING_CLAIM_DEVICE_MAX: ${BILLING_CLAIM_DEVICE_MAX:-10}
      BILLING_CLAIM_WINDOW_SEC: ${BILLING_CLAIM_WINDOW_SEC:-600}
      # GET /v1/ads-config per IP (0 = off). The body is public. Released apps send no token.
      BILLING_ADS_CONFIG_IP_MAX: ${BILLING_ADS_CONFIG_IP_MAX:-120}
      BILLING_ADS_CONFIG_WINDOW_SEC: ${BILLING_ADS_CONFIG_WINDOW_SEC:-600}
      BILLING_LINK_CLEAR_REQUIRE_TOKEN: ${BILLING_LINK_CLEAR_REQUIRE_TOKEN:-0}
      # HMAC key for device access tokens (set in .env, 32+ chars; empty = key kept in billing.db).
      BILLING_TOKEN_SECRET: ${BILLING_TOKEN_SECRET:-}
      # Secrets live only in .env (the panel shows them read-only): bot token, YooMoney secret, SMTP password,
      # indexer keys. Empty = the old value in the database settings is used until it is moved.
      BILLING_BOT_TOKEN: ${BILLING_BOT_TOKEN:-}
      BILLING_YOOMONEY_SECRET: ${BILLING_YOOMONEY_SECRET:-}
      BILLING_SMTP_PASS: ${BILLING_SMTP_PASS:-}
      BILLING_JACKETT_API_KEY: ${BILLING_JACKETT_API_KEY:-}
      BILLING_JACRED_API_KEY: ${BILLING_JACRED_API_KEY:-}
      BILLING_BITMAGNET_API_KEY: ${BILLING_BITMAGNET_API_KEY:-}
      BILLING_INDEXER_PASS: ${BILLING_INDEXER_PASS:-}
      # 0 (default since 27.10.2026) = refuse the old long-lived device tokens (apps before the token update); 1 = accept them again
      BILLING_LEGACY_TOKENS: ${BILLING_LEGACY_TOKENS:-0}
      TZ: ${TZ:-Europe/Moscow}
      # Datacenter IPs often cannot reach api.telegram.org — route bot via WARP HTTP proxy
      HTTP_PROXY: http://warp:1080
      HTTPS_PROXY: http://warp:1080
      NO_PROXY: jackett,jacred,torrserver,caddy,docker-proxy,dht-peers,localhost,127.0.0.1
      # «Проверить сиды» DHT counts. Empty DHT_PEERS_TOKEN: GET /v1/dht-peers answers 503 disabled.
      # Profile "dht". deploy.sh recreates the sidecar only when its build context changed,
      # or when this file changed and the container is already running.
      # The per-device cap is the admin setting dhtPerMinute (default 30 per minute).
      # BILLING_DHT_DEVICE_MAX applies only until that setting is saved. The window is one minute.
      BILLING_DHT_URL: ${BILLING_DHT_URL:-http://dht-peers:8788}
      BILLING_DHT_TOKEN: ${DHT_PEERS_TOKEN:-}
      BILLING_DHT_DEVICE_MAX: ${BILLING_DHT_DEVICE_MAX:-}
      NODE_USE_ENV_PROXY: "1"
      # «Мониторинг» tab (ops/billing/src/monitor.mjs): container state, restarts and memory through the
      # read-only proxy below. Alerts go to BILLING_MONITOR_CHAT_ID (default 536445442), sendMessage only.
      BILLING_DOCKER_PROXY_URL: http://docker-proxy:2375
      BILLING_MONITOR: ${BILLING_MONITOR:-1}
      BILLING_MONITOR_CHAT_ID: ${BILLING_MONITOR_CHAT_ID:-536445442}
      # 1 brings back the old admin notices the monitor duplicates (service down, Postgres backup)
      BILLING_LEGACY_ALERTS: ${BILLING_LEGACY_ALERTS:-0}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - ./data/billing:/data
    depends_on:
      jackett:
        condition: service_healthy
      jacred:
        condition: service_healthy
      warp:
        condition: service_started
      docker-proxy:
        condition: service_healthy
    networks:
      - omp
      - dockerapi
    # not published — only Caddy reaches it

  # SOCKS/HTTP proxy so billing can reach Telegram Bot API from a blocked VPS IP
  warp:
    image: caomingjun/warp@sha256:2891b92420a193a49c74cbd4387bee91f5c35fbc487fca8e8f739baed52c1d2b
    container_name: omp-warp
    restart: unless-stopped
    environment:
      WARP_SLEEP: "2"
    cap_add:
      - NET_ADMIN
      - MKNOD
      - AUDIT_WRITE
    device_cgroup_rules:
      - "c 10:200 rwm"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - ./data/warp:/var/lib/cloudflare-warp
    networks:
      - omp

  jackett:
    image: lscr.io/linuxserver/jackett@sha256:08b2bfb651dcfa2c896ab3beaf5c1ea6fe6abe317a1ae9bbbfe801e84b360c58
    container_name: omp-jackett
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-Europe/Moscow}
      AUTO_UPDATE: "true"
    volumes:
      - ./data/jackett:/config
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:9117/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - omp

  jacred:
    image: ghcr.io/jacred-fdb/jacred@sha256:26dad9965eb8427246b6b60e964d6371189c45e0517a3949eebbe90dc79d3983
    container_name: omp-jacred
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Moscow}
      ASPNETCORE_URLS: http://0.0.0.0:9117
    volumes:
      - ./jacred/init.yaml:/app/config/init.yaml:ro
      - ./data/jacred:/app/Data
    depends_on:
      torrserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:9117/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - omp

  torrserver:
    image: ghcr.io/yourok/torrserver@sha256:9188743fbdba14dccd38654a1185f44338bf5062f4098730acb8adeac6e596d7
    container_name: omp-torrserver
    restart: unless-stopped
    environment:
      TS_PORT: "8090"
      TS_DONTKILL: "1"
      TS_HTTPAUTH: "0"
      TS_CONF_PATH: /opt/ts/config
      TS_TORR_DIR: /opt/ts/torrents
    volumes:
      - ./data/torrserver/config:/opt/ts/config
      - ./data/torrserver/torrents:/opt/ts/torrents
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8090/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - omp

  # Cloudflare challenge solver for Jackett/JacRed indexers. Localhost-only publish.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
    container_name: omp-flaresolverr
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      TZ: Europe/Moscow
    ports:
      - "127.0.0.1:8191:8191"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1:8191/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - omp

  # Read-only Docker API for the billing «Мониторинг» tab. CONTAINERS=1 and POST=0: only GET/HEAD on
  # /containers (list, inspect, stats) gets through; start, stop, restart, exec and every other write is refused,
  # so the panel cannot restart anything. Reachable only from billing, over the internal "dockerapi" network.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: omp-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      POST: "0"
      # granted by default in the image; not needed
      EVENTS: "0"
      PING: "0"
      VERSION: "0"
      # listen on IPv4 :2375 only (the compose networks have no IPv6)
      DISABLE_IPV6: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # the entrypoint writes /tmp/haproxy.cfg and haproxy its pid to /run
    read_only: true
    tmpfs:
      - /run
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:2375/containers/json?limit=1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - dockerapi
    # no ports

  # On-demand DHT peer counts for «Проверить сиды». Profile "dht": a plain `up -d` does not start it.
  # deploy.sh starts it only when the build context changed. No published port. Billing calls it on the omp network.
  # The UDP socket opens on the first lookup and closes DHT_IDLE_MS after the last one. No database.
  dht-peers:
    profiles: ["dht"]
    build:
      context: ./dht-peers
    image: ${DHT_IMAGE:-omp-dht-peers:local}
    container_name: ${DHT_CONTAINER:-omp-dht-peers}
    restart: unless-stopped
    environment:
      DHT_HTTP_PORT: "8788"
      DHT_TOKEN: ${DHT_PEERS_TOKEN:-}
      DHT_LOOKUP_MS: "8000"
      DHT_IDLE_MS: "600000"
      DHT_CACHE_MS: "600000"
      NODE_OPTIONS: "--max-old-space-size=96"
      HOME: /tmp
    mem_limit: 150m
    memswap_limit: 150m
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - omp
    # no ports

networks:
  omp:
    driver: bridge
  # billing <-> docker-proxy only; internal: no route out, nothing published
  dockerapi:
    internal: true

volumes:
  caddy_data:
  caddy_config:
