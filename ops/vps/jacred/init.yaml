# JacRed (jacred-fdb) - first-boot template only.
# Put the real apikey in billing admin -> Сервисы (and on the VPS Data/), never in the APK.
# synctrackers is a 16-tracker subset of the jacred-fdb defaults, trimmed for a 2 GB VPS.
# tracks is off to save RAM on that box. See ops/vps/README.md.
listenport: 9117
apikey: "change-me"
devkey: "change-me"

tracks: false
tsuri:
  - http://torrserver:8090

openstats: false

# FileDB change log stays on. Caps are set because an uncapped log reached 11 GB in an hour.
logFdb: true
logFdbRetentionDays: 1
logFdbMaxSizeMb: 500
logFdbMaxFiles: 3

syncapi: https://sync.jacred.stream
# sync.jacred.stream through WARP: from the home NUC the direct path to Cloudflare stalls after about 20 KB,
# so /sync/fdb/torrents timed out and the base stopped growing (2026-10-21). JacRed reloads this file without a restart.
globalproxy:
  - pattern: "sync\\.jacred\\.stream"
    list:
      - http://warp:1080
synctrackers:
  - rutracker
  - rutor
  - kinozal
  - nnmclub
  - megapeer
  - bitru
  - toloka
  - mazepa
  - lostfilm
  - baibako
  - torrentby
  - selezen
  - animelayer
  - anidub
  - aniliberty
  - knaben
syncsport: false
# Spidr pulled torrents far beyond synctrackers.
syncspidr: false
timeSync: 120
