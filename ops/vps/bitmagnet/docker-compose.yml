# Test bitmagnet next to the NUC, not part of deploy.sh and not part of the omp stack.
# Own Postgres and own network. Does not mount billing data, the omp .env, or Caddy.
# Torznab stays on the host loopback unless BITMAGNET_BIND is a LAN address.
# Do not publish this port through Caddy or Cloudflare.
# Local change from tag v0.20.12-beta.5: DHT crawler enabled (--keys=dht_crawler)
# and host ports 3334/tcp+udp published, per official bitmagnet docs.
# Web/Torznab (3333) stay on BITMAGNET_BIND only (LAN or loopback, never 0.0.0.0).

name: omp-bitmagnet-test

services:
  bitmagnet:
    image: ghcr.io/bitmagnet-io/bitmagnet:v0.10.0
    container_name: omp-bitmagnet-test
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${BITMAGNET_PG_PASSWORD:?set BITMAGNET_PG_PASSWORD}
      TMDB_API_KEY: ${TMDB_API_KEY}
    command:
      - worker
      - run
      - --keys=http_server
      - --keys=queue_server
      - --keys=dht_crawler
    ports:
      - "${BITMAGNET_BIND:-127.0.0.1}:3333:3333"
      - "3334:3334/tcp"
      - "3334:3334/udp"
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256
    volumes:
      - bitmagnet_config:/root/.config/bitmagnet
    networks:
      - bitmagnet

  postgres:
    image: postgres:16-alpine
    container_name: omp-bitmagnet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${BITMAGNET_PG_PASSWORD:?set BITMAGNET_PG_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: bitmagnet
      PGUSER: postgres
    volumes:
      - bitmagnet_pg:/var/lib/postgresql/data
    shm_size: 256mb
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bitmagnet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - bitmagnet

networks:
  bitmagnet:
    driver: bridge

volumes:
  bitmagnet_pg:
  bitmagnet_config:
