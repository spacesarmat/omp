# Home NUC overrides (production since the 2026-10-19 cutover from the VPS). Usage:
#   docker compose -f docker-compose.yml -f docker-compose.nuc.yml up -d
# - caddy: plain HTTP on :80 only (TLS is terminated upstream by Cloudflare Tunnel / NPM),
#   so no ACME attempts for domains that still point at the VPS.
# - billing: (cutover 2026-10-19) Telegram block removed; NUC is the only bot poller.
#   VPS omp-billing is stopped.
# - docker-proxy (base file): read-only Docker API for the billing «Мониторинг» tab, internal network only.
# - postgres: billing database for the move off SQLite (docs/billing/postgres-cutover.md). Internal network
#   only, no published port, data in ./data/postgres. Needs BILLING_PG_PASSWORD in .env (hex, generated on the
#   server, never printed): compose refuses to start anything without it. Billing runs on Postgres since the
#   2026-10-19 cutover (BILLING_STORE default postgres; billing.db is no longer written). BILLING_READONLY=1
#   (set for one `up`) is a read-only window.
services:
  billing:
    environment:
      BILLING_BOT_POLL: "1"   # NUC is the only getUpdates poller (VPS omp-billing stopped)
      BILLING_STORE: ${BILLING_STORE:-postgres}
      BILLING_DATABASE_URL: postgres://omp_billing:${BILLING_PG_PASSWORD:?set BILLING_PG_PASSWORD in .env}@postgres:5432/omp_billing
      BILLING_READONLY: ${BILLING_READONLY:-0}
      # pg_dump every backupEveryHours (admin settings) into /opt/omp-backups/pg, mode 600
      BILLING_PG_BACKUP_DIR: /backups/pg
      # base list + postgres (pg does not use the HTTP proxy; listed so nothing ever routes it via warp)
      NO_PROXY: jackett,jacred,torrserver,caddy,postgres,docker-proxy,localhost,127.0.0.1
    volumes:
      - /opt/omp-backups/pg:/backups/pg
    networks:
      - omp
      - pg
      - dockerapi
  postgres:
    image: postgres:17-alpine
    container_name: omp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: omp_billing
      POSTGRES_DB: omp_billing
      POSTGRES_PASSWORD: ${BILLING_PG_PASSWORD:?set BILLING_PG_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      TZ: UTC
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=30", "-c", "log_min_duration_statement=500"]
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    shm_size: 128m
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omp_billing -d omp_billing -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - pg
    # no ports: only billing reaches it, over the internal "pg" network
  caddy:
    ports: !override
      - "80:80"
    volumes: !override
      - ./Caddyfile.nuc:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
  # Separate WARP (full-tunnel "warp" mode inside its own netns) used ONLY by cloudflared:
  # the home ISP breaks Cloudflare Tunnel edge connections, WARP carries them. Host routing is untouched.
  warp-tunnel:
    image: caomingjun/warp:latest
    container_name: omp-warp-tunnel
    restart: unless-stopped
    environment:
      WARP_SLEEP: "2"
    cap_add:
      - NET_ADMIN
      - MKNOD
      - AUDIT_WRITE
    device_cgroup_rules:
      - "c 10:200 rwm"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - ./data/warp-tunnel:/var/lib/cloudflare-warp
    extra_hosts:
      - "nuc-caddy:host-gateway"   # Caddy published on host :80 (private range is excluded from WARP)
    networks:
      - omp

  # Cloudflare Tunnel "omp-nuc" (6afa5d9c-8805-4fb0-a80e-d497737727a8), remotely managed.
  # Ingress (in Cloudflare): omp-player.online, www, billing, jackett, jacred -> http://nuc-caddy:80 (Host preserved).
  # Token lives only in ./tunnel.env (root 600, never commit).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: omp-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 --edge-ip-version 4 run
    env_file: ./tunnel.env
    network_mode: "service:warp-tunnel"
    depends_on:
      - warp-tunnel
      - caddy
  # Replica connector for Cloudflare Tunnel "home-nas" (702340e2-9120-4bf2-9855-2b034c026b7f), added 2026-10-19.
  # Ingress (in Cloudflare): music.omp-player.online -> http://192.168.1.191:8880 (NAS, reachable over LAN;
  # private range is excluded from WARP). The NAS's own connector can't reach the edge (ISP breaks TLS to :7844).
  # Token lives only in ./tunnel-home-nas.env (root 600, never commit).
  cloudflared-home-nas:
    image: cloudflare/cloudflared:latest
    container_name: omp-cloudflared-home-nas
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 --edge-ip-version 4 --metrics 127.0.0.1:20242 run
    env_file: ./tunnel-home-nas.env
    network_mode: "service:warp-tunnel"
    depends_on:
      - warp-tunnel

networks:
  # billing <-> postgres only; internal: no route out, nothing published
  pg:
    internal: true
