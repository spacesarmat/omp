[package]
name = "omp-desktop"
version = "0.30.1-beta.4"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7.0.0"
sha2 = "0.10.9"
encoding_rs = "0.8.44"
url = "2.5.8"
base64 = "0.23"
sevenz-rust = "0.6.1"
ureq = { version = "3.5.1", default-features = false, features = ["rustls", "cookies"] }
zip = "2.4"
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tempfile = "3.27.0"
