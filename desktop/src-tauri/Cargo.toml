[package]
name = "omp-desktop"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7.0.0"
sha2 = "0.10.9"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3.27.0"
