# Sends the files of an already posted release again as one block (reply to its post) and deletes the old file
# messages. Run by hand: release tag, post id (t.me/<channel>/<id>) and the old file message ids (e.g. 9-12).
name: Telegram release files
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.15.0
        required: true
      message_id:
        description: Id of the release post
        required: true
      delete_ids:
        description: Old file message ids to delete after the repost (e.g. 9-12 or 9,10)
        required: false
        default: ''
permissions:
  contents: read
jobs:
  files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download the release files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" --dir build --pattern 'OMP-*'
      - name: Repost as one block
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TAG: ${{ inputs.tag }}
          MESSAGE_ID: ${{ inputs.message_id }}
          DELETE_IDS: ${{ inputs.delete_ids }}
        run: node scripts/telegram-post.mjs "$TAG" --repost-files "$MESSAGE_ID" build "$DELETE_IDS"
