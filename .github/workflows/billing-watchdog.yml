name: Public uptime

# External check every 15 minutes from a GitHub-hosted runner, so an alert still goes out when the
# NUC and its local monitoring are fully down.
# URLs: https://billing.omp-player.online (404 is up: the process has no page on /),
# https://billing.omp-player.online/health, https://omp-player.online.
# 5xx (including 530) and timeouts are down. Three tries, 20s apart.
# Telegram is sendMessage only, on the transition to down and on recovery.
# State is the open GitHub issue labeled outage (the Actions cache is evicted by CI caches).
# Secrets (names only): TELEGRAM_BOT_TOKEN (the @OMPBILLINGBOT token, already used by the release
# posts) and WATCHDOG_TELEGRAM_CHAT_ID (the alert chat, the same as BILLING_MONITOR_CHAT_ID on the
# NUC). vars.TELEGRAM_CHAT_ID is the public release channel and is not used here.

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

concurrency:
  group: billing-watchdog
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: scripts
      - name: Check public endpoints
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.WATCHDOG_TELEGRAM_CHAT_ID }}
        run: node scripts/billing-watchdog.mjs
