name: 2160 Player update

# Opens chore/player2160-<tag>, waits until checks are green, squash-merges that branch only,
# then tags the next OMP beta and starts Release. A failed check stops before the merge.
# main stays protected: nothing is pushed to main except by merging the pull request.

on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

concurrency:
  group: upstream-component-update
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # to start ci.yml on the PR branch: pushes and PRs made with GITHUB_TOKEN do not trigger other workflows
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Apply the 2160 Player update
        id: apply
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "changed=false" >> "$GITHUB_OUTPUT"
          gh api repos/spacesarmat/2160player/releases/latest > "$RUNNER_TEMP/latest.json"
          LATEST=$(jq -r '.tag_name // empty' "$RUNNER_TEMP/latest.json")
          CURRENT=$(tr -d '[:space:]' < player2160.version)
          if [ -z "$LATEST" ] || [ "$LATEST" = "v$CURRENT" ]; then
            echo "2160 Player is up to date (v$CURRENT)"
            exit 0
          fi
          set +e
          node scripts/player2160-bump.mjs "$LATEST" "$RUNNER_TEMP/latest.json"
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            echo "::warning::$LATEST failed the sanity check (stable tag, newer version, aar and apk), skipping"
            exit 0
          fi
          if [ "$code" != "0" ]; then
            exit "$code"
          fi
          VERSION=${LATEST#v}
          URL=$(jq -r --arg name "player-core-${VERSION}.aar" '[.assets[]? | select(.name == $name) | .browser_download_url][0] // empty' "$RUNNER_TEMP/latest.json")
          SHA=$(jq -r --arg name "player-core-${VERSION}.aar" '[.assets[]? | select(.name == $name) | .digest // empty][0] // empty' "$RUNNER_TEMP/latest.json")
          SHA=${SHA#sha256:}
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/player-core.aar" "$URL"
          echo "$SHA  $RUNNER_TEMP/player-core.aar" | sha256sum -c -
          rm -f "$RUNNER_TEMP/player-core.aar"
          BRANCH="chore/player2160-$LATEST"
          OPEN=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$BRANCH" --json number --jq 'length')
          if [ "$OPEN" != "0" ]; then
            echo "An open pull request for $LATEST already exists ($BRANCH), skipping"
            git reset --hard
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/omp-release-bump.mjs
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        if: steps.apply.outputs.changed == 'true'
        run: |
          npm ci
          npm ci --prefix desktop
      - name: Test the update
        if: steps.apply.outputs.changed == 'true'
        run: npm test
      - name: Type-check the update
        if: steps.apply.outputs.changed == 'true'
        run: |
          npx tsc --noEmit -p .
          npx tsc --noEmit -p mobile
      - name: Push the branch and open the pull request
        if: steps.apply.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.apply.outputs.latest }}
          BRANCH: ${{ steps.apply.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add player2160.version android/app/build.gradle android/vendor/2160player CHANGELOG.md CHANGELOG.en.md \
            package.json package-lock.json desktop/package.json desktop/package-lock.json \
            desktop/src-tauri/tauri.conf.json webos/appinfo.json
          git commit -m "chore: 2160 Player $LATEST"
          git push --force origin "HEAD:refs/heads/$BRANCH"
          cat > "$RUNNER_TEMP/body.md" <<BODY
          Встроенный плеер 2160 обновлён до $LATEST (https://github.com/spacesarmat/2160player/releases/tag/$LATEST).

          - сабмодуль android/vendor/2160player на коммит тега
          - player2160.version и координата tv.p2160:player-core
          - строки в CHANGELOG переносятся из «Не выпущено» в следующую бету OMP
          - версия OMP поднимается на следующую бету, после зелёного CI PR вливается и выпускается релиз
          - перед PR файл player-core.aar скачан и проверен по sha256. Сборку APK делает CI этой ветки

          Открыто автоматически workflow «2160 Player update». CI на этой ветке запускается через workflow_dispatch;
          если проверок в PR нет, запустите CI вручную: Actions, CI, Run workflow, ветка $BRANCH.
          BODY
          if ! gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
              --title "chore: 2160 Player $LATEST" --body-file "$RUNNER_TEMP/body.md"; then
            echo "::error::Could not open the pull request. Turn on Settings, Actions, General, 'Allow GitHub Actions to create and approve pull requests', or open it by hand from $BRANCH."
            exit 1
          fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          PR=$(gh pr view --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --json number --jq .number)
          SHA=$(git rev-parse HEAD)
          NOTICE="Обновлен 2160 Player до ${LATEST}"
          export PR BRANCH SHA NOTICE
          bash scripts/upstream-ship.sh
