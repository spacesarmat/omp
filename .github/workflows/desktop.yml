name: Desktop

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag for the NSIS installer and feed
        required: false
        type: string
      publish:
        description: Publish the release asset and update feed
        required: true
        default: false
        type: boolean

# Cancel a superseded pull request. Push to main, tags and workflow_dispatch keep running.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests run the smoke matrix only when desktop, the shared UI it bundles
  # (src, mobile, design), lockfiles, vitest config, or this workflow change.
  # Linux apt, the Python peer dependency and cargo test run only when Rust inputs
  # change (desktop/src-tauri, Cargo files, this workflow, the path classifier,
  # the apt installer, or desktop/tests peer files). Push, tags and workflow_dispatch
  # keep both. The matrix still reports success when a step is skipped, so a required
  # check is not left pending.
  changes:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 1
      - name: Detect desktop paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          files="$(git diff --name-only "$BASE_SHA" HEAD)"
          result="$(bash scripts/desktop-ci-paths.sh <<< "$files")"
          printf '%s\n' "$result" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$result"
          printf '%s\n' "$files"

  smoke:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' }}
    # Apt steps fail at 10 minutes. 45 leaves room for a cold Cargo test build.
    timeout-minutes: 45
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Skip unchanged desktop paths
        if: needs.changes.outputs.desktop != 'true' && needs.changes.outputs.rust != 'true'
        run: echo "Pull request does not change desktop inputs."
      - name: Skip unchanged Rust paths
        if: needs.changes.outputs.desktop == 'true' && needs.changes.outputs.rust != 'true'
        run: echo "Pull request does not change Rust inputs. Apt, Python and cargo test are skipped."
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: needs.changes.outputs.desktop == 'true' || needs.changes.outputs.rust == 'true'
        with:
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: needs.changes.outputs.desktop == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Check Rust
        id: rust-version
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        run: echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - name: Cache Cargo
        if: needs.changes.outputs.rust == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-smoke-${{ steps.rust-version.outputs.version }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-smoke-${{ steps.rust-version.outputs.version }}-
      - name: Cache root node_modules
        id: root-node-modules
        if: needs.changes.outputs.desktop == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node24-root-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-root-modules-
      - name: Cache desktop node_modules
        id: desktop-node-modules
        if: needs.changes.outputs.desktop == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: desktop/node_modules
          key: ${{ runner.os }}-node24-desktop-modules-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-desktop-modules-
      - name: Install root dependencies
        if: needs.changes.outputs.desktop == 'true' && steps.root-node-modules.outputs.cache-hit == 'true'
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Install root dependencies exactly
        if: needs.changes.outputs.desktop == 'true' && steps.root-node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Install desktop dependencies
        if: needs.changes.outputs.desktop == 'true' && steps.desktop-node-modules.outputs.cache-hit == 'true'
        run: npm install --prefix desktop --prefer-offline --no-audit --no-fund
      - name: Install desktop dependencies exactly
        if: needs.changes.outputs.desktop == 'true' && steps.desktop-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefix desktop
      - name: Verify lockfiles
        if: needs.changes.outputs.desktop == 'true'
        run: git diff --exit-code -- package-lock.json desktop/package-lock.json
      - name: Desktop unit tests
        if: needs.changes.outputs.desktop == 'true'
        run: npx vitest run desktop/tests
      - name: Build desktop
        if: needs.changes.outputs.desktop == 'true'
        run: npm run build:desktop
      - name: Cache Linux apt packages
        if: needs.changes.outputs.rust == 'true' && matrix.os == 'ubuntu-latest'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .apt-cache
          key: ${{ runner.os }}-${{ runner.arch }}-apt-desktop-smoke-v1
      - name: Install Linux dependencies
        if: needs.changes.outputs.rust == 'true' && matrix.os == 'ubuntu-latest'
        timeout-minutes: 10
        env:
          APT_CACHE_DIR: ${{ github.workspace }}/.apt-cache
        run: bash scripts/ci-apt-install.sh libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: needs.changes.outputs.rust == 'true' && matrix.os == 'windows-latest'
        with:
          python-version: '3.12'
      - name: Install peer test dependency
        if: needs.changes.outputs.rust == 'true' && matrix.os == 'windows-latest'
        run: python -m pip install -r desktop/tests/requirements.txt
      - name: Rust tests
        if: needs.changes.outputs.rust == 'true'
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml


  # NSIS on push to main, version tags, and workflow_dispatch. Pull requests stop after smoke.
  package-windows:
    needs: smoke
    if: ${{ !cancelled() && needs.smoke.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Check Rust
        id: rust-version
        shell: bash
        run: echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ steps.rust-version.outputs.version }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-${{ steps.rust-version.outputs.version }}-
      - name: Cache root node_modules
        id: root-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node24-root-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-root-modules-
      - name: Cache desktop node_modules
        id: desktop-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: desktop/node_modules
          key: ${{ runner.os }}-node24-desktop-modules-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-desktop-modules-
      - name: Install root dependencies
        if: steps.root-node-modules.outputs.cache-hit == 'true'
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Install root dependencies exactly
        if: steps.root-node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Install desktop dependencies
        if: steps.desktop-node-modules.outputs.cache-hit == 'true'
        run: npm install --prefix desktop --prefer-offline --no-audit --no-fund
      - name: Install desktop dependencies exactly
        if: steps.desktop-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefix desktop
      - name: Verify lockfiles
        run: git diff --exit-code -- package-lock.json desktop/package-lock.json
      - run: npm run build:desktop
      - run: npm --prefix desktop run tauri -- build --bundles nsis
      - name: Prepare NSIS artifact
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          # Exact name: a restored Cargo target cache can still hold an older *-setup.exe.
          $installer = Get-Item -LiteralPath "desktop/src-tauri/target/release/bundle/nsis/OMP_${version}_x64-setup.exe"
          $output = "desktop/dist-desktop"
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          Copy-Item -LiteralPath $installer.FullName -Destination (Join-Path $output "OMP-$version-setup.exe") -Force
          $portable = Get-Item -LiteralPath desktop/src-tauri/target/release/omp-desktop.exe -ErrorAction SilentlyContinue
          if ($portable) {
            Copy-Item -LiteralPath $portable.FullName -Destination (Join-Path $output "OMP-$version-portable.exe") -Force
          }
      - name: Validate publication input
        if: github.event.inputs.publish == 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_TAG)) {
            throw "An existing release tag is required for publication"
          }
      - name: Build update feed
        if: github.event.inputs.publish == 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          $package = Get-ChildItem -LiteralPath desktop/dist-desktop -Filter "OMP-*-setup.exe" | Select-Object -First 1
          $portable = Get-ChildItem -LiteralPath desktop/dist-desktop -Filter "OMP-*-portable.exe" | Select-Object -First 1
          $version = (Get-Content -LiteralPath desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $feedArgs = @('scripts/desktop-update-feed.mjs', '--kind', 'windows', '--tag', $env:RELEASE_TAG, '--version', $version, '--nsis', $package.FullName, '--output', 'desktop/dist-desktop/update-windows.json')
          if ($portable) { $feedArgs += @('--portable', $portable.FullName) }
          node @feedArgs
      - name: Upload NSIS installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: omp-nsis-${{ github.event.inputs.tag || 'preview' }}
          path: |
            desktop/dist-desktop/OMP-*-setup.exe
            desktop/dist-desktop/OMP-*-portable.exe
          if-no-files-found: error
      - name: Upload update feed
        if: github.event.inputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: update-windows-${{ github.event.inputs.tag }}
          path: desktop/dist-desktop/update-windows.json
          if-no-files-found: error
      - name: Publish release asset and feed
        if: github.event.inputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $package = Get-ChildItem -LiteralPath desktop/dist-desktop -Filter "OMP-*-setup.exe" | Select-Object -First 1
          $portable = Get-ChildItem -LiteralPath desktop/dist-desktop -Filter "OMP-*-portable.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($portable) {
            gh release upload $env:RELEASE_TAG $package.FullName $portable.FullName --clobber
          } else {
            gh release upload $env:RELEASE_TAG $package.FullName --clobber
          }
          $content = [Convert]::ToBase64String([IO.File]::ReadAllBytes("desktop/dist-desktop/update-windows.json"))
          $sha = $null
          $nativePreference = $PSNativeCommandUseErrorActionPreference
          $PSNativeCommandUseErrorActionPreference = $false
          try {
            $lookup = gh api "repos/${{ github.repository }}/contents/update-windows.json?ref=gh-pages" --jq .sha 2>&1
            $lookupExit = $LASTEXITCODE
          } finally {
            $PSNativeCommandUseErrorActionPreference = $nativePreference
          }
          if ($lookupExit -ne 0 -and ($lookup | Out-String) -notmatch '404|Not Found') {
            throw ($lookup | Out-String)
          }
          if ($lookupExit -eq 0) {
            $sha = $lookup
          }
          if ($sha) {
            gh api --method PUT "repos/${{ github.repository }}/contents/update-windows.json" -f message="Update Windows desktop feed" -f content="$content" -f sha="$sha" -f branch="gh-pages"
          } else {
            gh api --method PUT "repos/${{ github.repository }}/contents/update-windows.json" -f message="Add Windows desktop feed" -f content="$content" -f branch="gh-pages"
          }

  package-macos:
    needs: smoke
    if: ${{ !cancelled() && needs.smoke.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Check Rust
        id: rust-version
        shell: bash
        run: echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ steps.rust-version.outputs.version }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-${{ steps.rust-version.outputs.version }}-
      - name: Cache root node_modules
        id: root-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node24-root-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-root-modules-
      - name: Cache desktop node_modules
        id: desktop-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: desktop/node_modules
          key: ${{ runner.os }}-node24-desktop-modules-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-desktop-modules-
      - name: Install root dependencies
        if: steps.root-node-modules.outputs.cache-hit == 'true'
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Install root dependencies exactly
        if: steps.root-node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Install desktop dependencies
        if: steps.desktop-node-modules.outputs.cache-hit == 'true'
        run: npm install --prefix desktop --prefer-offline --no-audit --no-fund
      - name: Install desktop dependencies exactly
        if: steps.desktop-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefix desktop
      - name: Verify lockfiles
        run: git diff --exit-code -- package-lock.json desktop/package-lock.json
      - name: Add Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm run build:desktop
      - name: Build Apple Silicon DMG
        run: npm --prefix desktop run tauri -- build --target aarch64-apple-darwin --bundles dmg
      - name: Build Intel DMG
        run: npm --prefix desktop run tauri -- build --target x86_64-apple-darwin --bundles dmg
      - name: Prepare DMG artifacts
        run: |
          version=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('desktop/src-tauri/tauri.conf.json','utf8')).version)")
          mkdir -p desktop/dist-desktop
          # Exact names: a restored Cargo target cache can still hold an older .dmg.
          cp "desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/OMP_${version}_aarch64.dmg" "desktop/dist-desktop/OMP-${version}-macos-arm64.dmg"
          cp "desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/OMP_${version}_x64.dmg" "desktop/dist-desktop/OMP-${version}-macos-x64.dmg"
      - name: Build update feed
        if: github.event.inputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          version=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('desktop/src-tauri/tauri.conf.json','utf8')).version)")
          node scripts/desktop-update-feed.mjs --kind macos --tag "$RELEASE_TAG" --version "$version" \
            --arm64 desktop/dist-desktop/OMP-${version}-macos-arm64.dmg \
            --x64 desktop/dist-desktop/OMP-${version}-macos-x64.dmg \
            --output desktop/dist-desktop/update-macos.json
      - name: Upload macOS disk images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: omp-dmg-${{ github.event.inputs.tag || 'preview' }}
          path: desktop/dist-desktop/OMP-*-macos-*.dmg
          if-no-files-found: error
      - name: Upload update feed
        if: github.event.inputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: update-macos-${{ github.event.inputs.tag }}
          path: desktop/dist-desktop/update-macos.json
          if-no-files-found: error
      - name: Publish release asset and feed
        if: github.event.inputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(desktop/dist-desktop/OMP-*-macos-*.dmg)
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          feed=desktop/dist-desktop/update-macos.json
          content=$(base64 < "$feed" | tr -d '\n')
          set +e
          lookup=$(gh api "repos/${{ github.repository }}/contents/update-macos.json?ref=gh-pages" --jq .sha 2>&1)
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            if ! printf '%s' "$lookup" | grep -Eq '404|Not Found'; then
              printf '%s\n' "$lookup" >&2
              exit 1
            fi
            gh api --method PUT "repos/${{ github.repository }}/contents/update-macos.json" -f message="Add macOS desktop feed" -f content="$content" -f branch="gh-pages"
          else
            gh api --method PUT "repos/${{ github.repository }}/contents/update-macos.json" -f message="Update macOS desktop feed" -f content="$content" -f sha="$lookup" -f branch="gh-pages"
          fi

  package-linux:
    needs: smoke
    if: ${{ !cancelled() && needs.smoke.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    # Apt steps fail at 10 minutes. 60 leaves room for a cold AppImage and deb build.
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
