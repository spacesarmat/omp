name: Desktop

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag for the NSIS installer and feed
        required: false
        type: string
      publish:
        description: Publish the release asset and update feed
        required: true
        default: false
        type: boolean

jobs:
  smoke:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Check Rust
        id: rust-version
        shell: bash
        run: echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-smoke-${{ steps.rust-version.outputs.version }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-smoke-${{ steps.rust-version.outputs.version }}-
      - name: Cache root node_modules
        id: root-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node24-root-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-root-modules-
      - name: Cache desktop node_modules
        id: desktop-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: desktop/node_modules
          key: ${{ runner.os }}-node24-desktop-modules-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-desktop-modules-
      - name: Install root dependencies
        if: steps.root-node-modules.outputs.cache-hit == 'true'
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Install root dependencies exactly
        if: steps.root-node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Install desktop dependencies
        if: steps.desktop-node-modules.outputs.cache-hit == 'true'
        run: npm install --prefix desktop --prefer-offline --no-audit --no-fund
      - name: Install desktop dependencies exactly
        if: steps.desktop-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefix desktop
      - name: Verify lockfiles
        run: git diff --exit-code -- package-lock.json desktop/package-lock.json
      - run: npx vitest run desktop/tests
      - run: npm run build:desktop
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.os == 'windows-latest'
        with:
          python-version: '3.12'
      - name: Install peer test dependency
        if: matrix.os == 'windows-latest'
        run: python -m pip install -r desktop/tests/requirements.txt
      - name: Rust tests
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml


  package-windows:
    needs: smoke
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Check Rust
        id: rust-version
        shell: bash
        run: echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ steps.rust-version.outputs.version }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-${{ steps.rust-version.outputs.version }}-
      - name: Cache root node_modules
        id: root-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node24-root-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-root-modules-
      - name: Cache desktop node_modules
        id: desktop-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: desktop/node_modules
          key: ${{ runner.os }}-node24-desktop-modules-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-desktop-modules-
      - name: Install root dependencies
        if: steps.root-node-modules.outputs.cache-hit == 'true'
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Install root dependencies exactly
        if: steps.root-node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Install desktop dependencies
        if: steps.desktop-node-modules.outputs.cache-hit == 'true'
        run: npm install --prefix desktop --prefer-offline --no-audit --no-fund
      - name: Install desktop dependencies exactly
        if: steps.desktop-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefix desktop
      - name: Verify lockfiles
        run: git diff --exit-code -- package-lock.json desktop/package-lock.json
      - run: npm run build:desktop
      - run: npm --prefix desktop run tauri -- build --bundles nsis
      - name: Prepare NSIS artifact
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $installer = Get-ChildItem -LiteralPath desktop/src-tauri/target/release/bundle/nsis -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer was not produced"
          }
          $output = "desktop/dist-desktop"
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          Copy-Item -LiteralPath $installer.FullName -Destination (Join-Path $output "OMP-$version-setup.exe") -Force
      - name: Validate publication input
        if: github.event.inputs.publish == 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_TAG)) {
            throw "An existing release tag is required for publication"
          }
      - name: Build update feed
        if: github.event.inputs.publish == 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          $package = Get-ChildItem -LiteralPath desktop/dist-desktop -Filter "OMP-*-setup.exe" | Select-Object -First 1
          $version = (Get-Content -LiteralPath desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          node scripts/desktop-update-feed.mjs --tag $env:RELEASE_TAG --version $version --nsis $package.FullName --output desktop/dist-desktop/update-windows.json
      - name: Upload NSIS installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: omp-nsis-${{ github.event.inputs.tag || 'preview' }}
          path: desktop/dist-desktop/OMP-*-setup.exe
          if-no-files-found: error
      - name: Upload update feed
        if: github.event.inputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: update-windows-${{ github.event.inputs.tag }}
          path: desktop/dist-desktop/update-windows.json
          if-no-files-found: error
      - name: Publish release asset and feed
        if: github.event.inputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $package = Get-ChildItem -LiteralPath desktop/dist-desktop -Filter "OMP-*-setup.exe" | Select-Object -First 1
          gh release upload $env:RELEASE_TAG $package.FullName --clobber
          $content = [Convert]::ToBase64String([IO.File]::ReadAllBytes("desktop/dist-desktop/update-windows.json"))
          $sha = $null
          try {
            $sha = gh api "repos/${{ github.repository }}/contents/update-windows.json?ref=gh-pages" --jq .sha 2>$null
          } catch {
            if ($_.Exception.Message -notmatch '404|Not Found') {
              throw
            }
          }
          if ($sha) {
            gh api --method PUT "repos/${{ github.repository }}/contents/update-windows.json" -f message="Update Windows desktop feed" -f content="$content" -f sha="$sha" -f branch="gh-pages"
          } else {
            gh api --method PUT "repos/${{ github.repository }}/contents/update-windows.json" -f message="Add Windows desktop feed" -f content="$content" -f branch="gh-pages"
          }
