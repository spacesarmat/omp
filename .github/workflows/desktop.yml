            desktop/package-lock.json
      - name: Check Rust
        id: rust-version
        shell: bash
        run: echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ steps.rust-version.outputs.version }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-${{ steps.rust-version.outputs.version }}-
      - name: Cache root node_modules
        id: root-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node24-root-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-root-modules-
      - name: Cache desktop node_modules
        id: desktop-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: desktop/node_modules
          key: ${{ runner.os }}-node24-desktop-modules-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-desktop-modules-
      - name: Install root dependencies
        if: steps.root-node-modules.outputs.cache-hit == 'true'
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Install root dependencies exactly
        if: steps.root-node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Install desktop dependencies
        if: steps.desktop-node-modules.outputs.cache-hit == 'true'
        run: npm install --prefix desktop --prefer-offline --no-audit --no-fund
      - name: Install desktop dependencies exactly
        if: steps.desktop-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefix desktop
      - name: Verify lockfiles
        run: git diff --exit-code -- package-lock.json desktop/package-lock.json
      - name: Cache Linux apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .apt-cache
          key: ${{ runner.os }}-${{ runner.arch }}-apt-desktop-package-v1
      - name: Install Linux dependencies
        timeout-minutes: 10
        env:
          APT_CACHE_DIR: ${{ github.workspace }}/.apt-cache
        run: bash scripts/ci-apt-install.sh libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - run: npm run build:desktop
      - run: npm --prefix desktop run tauri -- build --bundles appimage,deb
      - name: Prepare Linux artifacts
        run: |
          version=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('desktop/src-tauri/tauri.conf.json','utf8')).version)")
          mkdir -p desktop/dist-desktop
          # Exact names: a restored Cargo target cache can still hold an older .deb, and cp then refuses a file target.
          cp "desktop/src-tauri/target/release/bundle/appimage/OMP_${version}_amd64.AppImage" "desktop/dist-desktop/OMP-${version}-linux-x64.AppImage"
          cp "desktop/src-tauri/target/release/bundle/deb/OMP_${version}_amd64.deb" "desktop/dist-desktop/OMP-${version}-linux-x64.deb"
      - name: Build update feed
        if: github.event.inputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          version=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('desktop/src-tauri/tauri.conf.json','utf8')).version)")
          node scripts/desktop-update-feed.mjs --kind linux --tag "$RELEASE_TAG" --version "$version" \
            --appimage "desktop/dist-desktop/OMP-${version}-linux-x64.AppImage" \
            --deb "desktop/dist-desktop/OMP-${version}-linux-x64.deb" \
            --output desktop/dist-desktop/update-linux.json
      - name: Upload Linux packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: omp-linux-${{ github.event.inputs.tag || 'preview' }}
          path: |
            desktop/dist-desktop/OMP-*-linux-x64.AppImage
            desktop/dist-desktop/OMP-*-linux-x64.deb
          if-no-files-found: error
      - name: Upload update feed
        if: github.event.inputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: update-linux-${{ github.event.inputs.tag }}
          path: desktop/dist-desktop/update-linux.json
          if-no-files-found: error
      - name: Publish release asset and feed
        if: github.event.inputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(desktop/dist-desktop/OMP-*-linux-x64.AppImage desktop/dist-desktop/OMP-*-linux-x64.deb)
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          feed=desktop/dist-desktop/update-linux.json
          content=$(base64 -w0 < "$feed")
          set +e
          lookup=$(gh api "repos/${{ github.repository }}/contents/update-linux.json?ref=gh-pages" --jq .sha 2>&1)
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            if ! printf '%s' "$lookup" | grep -Eq '404|Not Found'; then
              printf '%s\n' "$lookup" >&2
              exit 1
            fi
            gh api --method PUT "repos/${{ github.repository }}/contents/update-linux.json" -f message="Add Linux desktop feed" -f content="$content" -f branch="gh-pages"
          else
            gh api --method PUT "repos/${{ github.repository }}/contents/update-linux.json" -f message="Update Linux desktop feed" -f content="$content" -f sha="$lookup" -f branch="gh-pages"
          fi

