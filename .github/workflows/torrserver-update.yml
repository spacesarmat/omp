name: TorrServer update

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

concurrency:
  group: torrserver-update
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release: ${{ steps.bump.outputs.release }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # applies the update to the working tree only: nothing is committed, tagged or pushed until the checks below pass
      - name: Apply the TorrServer update
        id: apply
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "changed=false" >> "$GITHUB_OUTPUT"
          gh api repos/YouROK/TorrServer/releases/latest > "$RUNNER_TEMP/latest.json"
          LATEST=$(jq -r '.tag_name // empty' "$RUNNER_TEMP/latest.json")
          CURRENT=$(tr -d '[:space:]' < torrserver.version)
          DIGEST=$(jq -r '[.assets[]? | select(.name == "TorrServer-android-arm64") | .digest // empty][0] // empty' "$RUNNER_TEMP/latest.json")
          if [ -z "$LATEST" ] || [ "$LATEST" = "$CURRENT" ]; then
            echo "TorrServer is up to date ($CURRENT)"
            exit 0
          fi
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "::warning::$LATEST has no TorrServer-android-arm64 asset with a sha256 digest, skipping"; exit 0 ;;
          esac
          # a merged feature waits for its manual release: do not ship it under a TorrServer bump
          OMP_VERSION=$(jq -r '.version' package.json)
          if ! git rev-parse -q --verify "refs/tags/v$OMP_VERSION" > /dev/null; then
            echo "OMP $OMP_VERSION is not released yet (no tag v$OMP_VERSION), skipping the TorrServer bump"
            exit 0
          fi
          VERSION=$(node scripts/torrserver-bump.mjs "$LATEST" "$RUNNER_TEMP/latest.json")
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      # the same checks the release runs (plus the type checks): a failing update leaves no commit, version bump or tag
      - name: Install dependencies
        if: steps.apply.outputs.changed == 'true'
        run: npm ci
      - name: Test the update
        if: steps.apply.outputs.changed == 'true'
        run: npm test
      - name: Type-check the update
        if: steps.apply.outputs.changed == 'true'
        run: |
          npx tsc --noEmit -p .
          npx tsc --noEmit -p mobile
      - name: Commit, tag and push the update
        id: bump
        if: steps.apply.outputs.changed == 'true'
        env:
          LATEST: ${{ steps.apply.outputs.latest }}
          VERSION: ${{ steps.apply.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add torrserver.version android/app/src/main/res/raw/torrserver.json package.json package-lock.json webos/appinfo.json CHANGELOG.md
          git commit -m "chore: TorrServer $LATEST"
          git tag "v$VERSION"
          git push --atomic origin HEAD:main "v$VERSION"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.check.outputs.tag }}
    secrets: inherit
