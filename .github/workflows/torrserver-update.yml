name: TorrServer update

# Opens chore/torrserver-<tag>, waits until checks are green, squash-merges that branch only,
# then tags the next OMP beta and starts Release. A failed check stops before the merge.
# main stays protected: nothing is pushed to main except by merging the pull request.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

concurrency:
  group: upstream-component-update
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # to start ci.yml on the PR branch: pushes and PRs made with GITHUB_TOKEN do not trigger other workflows
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      # applies the update to the working tree only: nothing is committed or pushed until the checks below pass
      - name: Apply the TorrServer update
        id: apply
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "changed=false" >> "$GITHUB_OUTPUT"
          gh api repos/YouROK/TorrServer/releases/latest > "$RUNNER_TEMP/latest.json"
          LATEST=$(jq -r '.tag_name // empty' "$RUNNER_TEMP/latest.json")
          CURRENT=$(tr -d '[:space:]' < torrserver.version)
          DIGEST=$(jq -r '[.assets[]? | select(.name == "TorrServer-android-arm64") | .digest // empty][0] // empty' "$RUNNER_TEMP/latest.json")
          if [ -z "$LATEST" ] || [ "$LATEST" = "$CURRENT" ]; then
            echo "TorrServer is up to date ($CURRENT)"
            exit 0
          fi
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "::warning::$LATEST has no TorrServer-android-arm64 asset with a sha256 digest, skipping"; exit 0 ;;
          esac
          set +e
          node scripts/torrserver-sanity.mjs "$CURRENT" "$RUNNER_TEMP/latest.json"
          sane=$?
          set -e
          if [ "$sane" = "2" ]; then
            echo "::warning::$LATEST failed the sanity check (stable tag, newer number, sha256, size), skipping"
            exit 0
          fi
          if [ "$sane" != "0" ]; then
            echo "::error::sanity check failed"
            exit "$sane"
          fi
          URL=$(jq -r '[.assets[]? | select(.name == "TorrServer-android-arm64") | .browser_download_url][0] // empty' "$RUNNER_TEMP/latest.json")
          SHA=${DIGEST#sha256:}
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/TorrServer-android-arm64" "$URL"
          echo "$SHA  $RUNNER_TEMP/TorrServer-android-arm64" | sha256sum -c -
          rm -f "$RUNNER_TEMP/TorrServer-android-arm64"
          BRANCH="chore/torrserver-$LATEST"
          OPEN=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$BRANCH" --json number --jq 'length')
          if [ "$OPEN" != "0" ]; then
            echo "An open pull request for $LATEST already exists ($BRANCH), skipping"
            exit 0
          fi
          node scripts/torrserver-bump.mjs "$LATEST" "$RUNNER_TEMP/latest.json"
          node scripts/omp-release-bump.mjs
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
      # the same checks the release runs (plus the type checks): a failing update opens no pull request
      - name: Install dependencies
        if: steps.apply.outputs.changed == 'true'
        run: |
          npm ci
          npm ci --prefix desktop
      - name: Test the update
        if: steps.apply.outputs.changed == 'true'
        run: npm test
      - name: Type-check the update
        if: steps.apply.outputs.changed == 'true'
        run: |
          npx tsc --noEmit -p .
          npx tsc --noEmit -p mobile
      - name: Push the branch and open the pull request
        if: steps.apply.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.apply.outputs.latest }}
          BRANCH: ${{ steps.apply.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add torrserver.version android/app/src/main/res/raw/torrserver.json CHANGELOG.md CHANGELOG.en.md \
            desktop/src-tauri/src/platform.rs desktop/src-tauri/src/download/tests.rs desktop/src/platform/native.ts \
            package.json package-lock.json desktop/package.json desktop/package-lock.json \
            desktop/src-tauri/tauri.conf.json desktop/src-tauri/Cargo.toml desktop/src-tauri/Cargo.lock \
            webos/appinfo.json
          git commit -m "chore: TorrServer $LATEST"
          # the branch belongs to this workflow; a leftover from a closed pull request is replaced with a fresh one on main
          git push --force origin "HEAD:refs/heads/$BRANCH"
          node scripts/torrserver-sanity.mjs --summary "$RUNNER_TEMP/latest.json" > "$RUNNER_TEMP/summary.txt"
          cat > "$RUNNER_TEMP/body.md" <<OMPBODY
          Встроенный TorrServer обновлён до $LATEST (https://github.com/YouROK/TorrServer/releases/tag/$LATEST).

          - torrserver.version и закреплённая загрузка (android/app/src/main/res/raw/torrserver.json: url, sha256, размер)
          - тот же выпуск для Windows (desktop/src-tauri/src/platform.rs)
          - строка в CHANGELOG переносится из «Не выпущено» в следующую бету OMP
          - версия OMP поднимается на следующую бету, после зелёного CI PR вливается и выпускается релиз
          - перед PR бинарник TorrServer-android-arm64 скачан и проверен по sha256

          Изменения upstream:

          OMPBODY
          cat "$RUNNER_TEMP/summary.txt" >> "$RUNNER_TEMP/body.md"
          cat >> "$RUNNER_TEMP/body.md" <<OMPBODY

          Открыто автоматически workflow «TorrServer update». CI на этой ветке запускается через workflow_dispatch;
          если проверок в PR нет, запустите CI вручную: Actions, CI, Run workflow, ветка $BRANCH.
          OMPBODY
          if ! gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
              --title "chore: TorrServer $LATEST" --body-file "$RUNNER_TEMP/body.md"; then
            echo "::error::Could not open the pull request. Turn on Settings, Actions, General, 'Allow GitHub Actions to create and approve pull requests', or open it by hand from $BRANCH."
            exit 1
          fi
          # PRs and pushes made with GITHUB_TOKEN start no workflows, except workflow_dispatch: run CI on the branch
          # so build, android and billing report on the pull request's head commit
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          gh workflow run desktop.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH" -f publish=false
          PR=$(gh pr view "$BRANCH" --repo "$GITHUB_REPOSITORY" --json number --jq .number)
          SHA=$(git rev-parse HEAD)
          NOTICE="Обновлен TorrServer до ${LATEST}"
          EXPECTED="CI,Desktop"
          export PR BRANCH SHA NOTICE EXPECTED
          bash scripts/upstream-ship.sh
