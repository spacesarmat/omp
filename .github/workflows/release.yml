name: Release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: Release tag (vX.Y.Z) to build
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tag must match package.json version
        run: test "${TAG}" = "v$(node -p "require('./package.json').version")"
      - run: npm test
      - run: npm run build
      - run: node scripts/package.mjs
      - run: npm run check:boot
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Build signed Android APKs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Нет ключа подписи Android (секреты ANDROID_*)"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/omp.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/omp.jks"
          VERSION=$(node -p "require('./package.json').version")
          npm run android:sync
          (cd android && ./gradlew assembleRelease)
          OUT=android/app/build/outputs/apk/release
          cp "$OUT/app-universal-release.apk" "build/OMP-${VERSION}.apk"
          cp "$OUT/app-arm64-v8a-release.apk" "build/OMP-${VERSION}-arm64.apk"
          cp "$OUT/app-armeabi-v7a-release.apk" "build/OMP-${VERSION}-armv7.apk"
          rm -f "$RUNNER_TEMP/omp.jks"
          echo "APK sizes (bytes):"
          ls -l "build/OMP-${VERSION}-arm64.apk" "build/OMP-${VERSION}-armv7.apk" "build/OMP-${VERSION}.apk"
      - name: Homebrew Channel files
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mv "$(ls build/com.spacesarmat.torrplayer_*_all.ipk)" "build/OMP-${VERSION}-webOS.ipk"
          node scripts/hb-manifest.mjs "$TAG" "build/OMP-${VERSION}-webOS.ipk" "build/OMP-${VERSION}.apk" "build/OMP-${VERSION}-arm64.apk" "build/OMP-${VERSION}-armv7.apk"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          IPK="build/OMP-${VERSION}-webOS.ipk"
          APK="build/OMP-${VERSION}.apk"
          APK64="build/OMP-${VERSION}-arm64.apk"
          APK32="build/OMP-${VERSION}-armv7.apk"
          sed "s/{{TAG}}/${TAG}/g" .github/release-notes.md > notes.md
          printf '\n' >> notes.md
          # English changelog of this version (nothing when CHANGELOG.en.md lacks it)
          EN_NOTES=$(node scripts/changelog-en.mjs "$VERSION")
          if [ -n "$EN_NOTES" ]; then printf '## English\n\n%s\n\n' "$EN_NOTES" >> notes.md; fi
          for F in "$IPK" "$APK64" "$APK32" "$APK"; do
            printf 'SHA-256 `%s`: `%s`\n' "$(basename "$F")" "$(sha256sum "$F" | cut -d' ' -f1)" >> notes.md
          done
          # a beta (vX.Y.Z-beta.N) is a pre-release: never «latest», never the Homebrew repository
          EXTRA=""
          case "$TAG" in *-beta.*) EXTRA="--prerelease --latest=false" ;; esac
          gh release create "$TAG" "$IPK" "$APK64" "$APK32" "$APK" "build/hb/com.spacesarmat.torrplayer.manifest.json" --title "OMP $TAG" --notes-file notes.md --generate-notes $EXTRA
      - name: Publish update feed to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh-pages holds every feed: a release replaces them all (the beta ones too), a beta only its two
          git clone -q --depth 1 -b gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" build/pages || mkdir -p build/pages
          rm -rf build/pages/.git
          case "$TAG" in
            *-beta.*) cp build/hb/update-beta.json build/hb/update-android-beta.json build/pages/ ;;
            *) cp -r build/hb/. build/pages/ ;;
          esac
          cd build/pages
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Update feed for ${TAG}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      # Telegram channel post (skipped without the bot token): every build as a reply; files over the 50 MB bot
      # limit are linked (and named in the log) so the owner can forward them by hand. A failure must not fail the release.
      # A stable release whose docs/screenshots/release-<version>/ is in the tag checkout above goes as a photo album.
      - name: Post to Telegram
        # betas are not posted: the channel gets releases only
        if: ${{ !contains(inputs.tag || github.ref_name, '-beta.') }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: |
          node scripts/telegram-post.mjs "$TAG" build
