name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z) to build
        type: string
        required: true
      publish:
        description: Create the GitHub release, update feed and Telegram post
        type: boolean
        default: true
  workflow_call:
    inputs:
      tag:
        description: Release tag (vX.Y.Z) to build
        type: string
        required: true
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
      TELEGRAM_BOT_TOKEN:
        required: false
      TMDB_API_KEY:
        required: true

# Publish overrides contents to write. actions: read lets the test job see CI runs.
permissions:
  contents: read
  actions: read

jobs:
  # npm test no longer sits in front of the APK build. A commit that already passed CI on main skips it.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: billing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d billing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix ops/billing ci
      # Root tests import desktop/src, which resolves @tauri-apps/api from desktop/node_modules.
      - run: npm ci --prefix desktop
      - name: Tag must match package.json version
        run: test "${TAG}" = "v$(node -p "require('./package.json').version")"
      - name: CI already passed for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sha=$(git rev-parse HEAD)
          # The job checks out the tag. An older tag does not contain this helper.
          if [ ! -f scripts/release-ci-skip.mjs ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "helper is not in this checkout, tests will run"
            exit 0
          fi
          json=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$sha" --workflow ci.yml --json conclusion,event,headSha)
          result=$(printf '%s' "$json" | node scripts/release-ci-skip.mjs "$sha")
          printf '%s\n' "$result" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$result"
      - run: npm test
        if: steps.ci.outputs.skip != 'true'
        env:
          BILLING_TEST_DATABASE_URL: postgres://test:test@localhost:5432/billing_test
          BILLING_TEST_REQUIRE_PG: '1'

  # webOS ipk. Independent of the Android build.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # tsc in npm run build typechecks desktop/src
      - run: npm ci --prefix desktop
      - name: Require the TMDB API key
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -z "$TMDB_API_KEY" ]; then
            echo "::error::Нет секрета TMDB_API_KEY. Добавьте ключ TMDB API v3 в Settings → Secrets and variables → Actions. Релизная сборка без него не выпускается."
            exit 1
          fi
      - name: Build the web app
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: npm run build
      - run: node scripts/package.mjs
      - run: npm run check:boot
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-ipk
          path: build/com.spacesarmat.torrplayer_*_all.ipk
          retention-days: 1
          if-no-files-found: error

  # Signed universal, arm64 and armv7 APKs. Same outputs as before. Runs beside tests and the webOS pack.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          # android/vendor/2160player (2160 Player's player-core, included build in android/settings.gradle)
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # tsc inside android:sync typechecks desktop/src
      - run: npm ci --prefix desktop
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          # 17 for the player-core toolchain (jvmToolchain(17) in the submodule), 21 (last = default) for Gradle.
          # Gradle User Home is cached by setup-gradle below, not here (the two caches conflict).
          java-version: |
            17
            21
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      # Same Gradle User Home cache as the android CI job (dependencies, wrapper, build cache).
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: false
      - name: Cache Gradle configuration
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            android/.gradle/configuration-cache
            android/vendor/2160player/.gradle/configuration-cache
          key: ${{ runner.os }}-gradle-config-release-v1-${{ hashFiles('android/**/*.gradle', 'android/**/*.gradle.kts', 'android/**/*.properties', 'android/**/*.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}
      # newer runner images leave less free disk; packaging three APKs with libvlc needs a few GB
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules/@*/cli "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          df -h /
      - name: Build signed Android APKs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # android:sync runs the mobile and Android TV Vite builds, which bake the built-in key
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Нет ключа подписи Android (секреты ANDROID_*)"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/omp.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/omp.jks"
          VERSION=$(node -p "require('./package.json').version")
          npm run android:sync
          # One assembleRelease. --build-cache and --parallel match ci.yml. Every ABI stays: universal, arm64 and armv7.
          (cd android && ./gradlew --build-cache --parallel -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64 assembleRelease --stacktrace) || { df -h /; exit 1; }
          OUT=android/app/build/outputs/apk/release
          mkdir -p build
          cp "$OUT/app-universal-release.apk" "build/OMP-${VERSION}.apk"
          cp "$OUT/app-arm64-v8a-release.apk" "build/OMP-${VERSION}-arm64.apk"
          cp "$OUT/app-armeabi-v7a-release.apk" "build/OMP-${VERSION}-armv7.apk"
          rm -f "$RUNNER_TEMP/omp.jks"
          echo "APK sizes (bytes):"
          ls -l "build/OMP-${VERSION}-arm64.apk" "build/OMP-${VERSION}-armv7.apk" "build/OMP-${VERSION}.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-apk
          path: build/OMP-*.apk
          retention-days: 1
          if-no-files-found: error

  # Tag pushes and workflow_call always publish. workflow_dispatch publishes only when publish is true.
  publish:
    needs: [test, web, android]
    if: needs.test.result == 'success' && needs.web.result == 'success' && needs.android.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-ipk
          path: build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-apk
          path: build
      - name: Refuse a dispatch that asked not to publish
        env:
          PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: |
          if [ "$PUBLISH" != "true" ]; then
            echo "::error::publish is off"
            exit 1
          fi
      - name: Homebrew Channel files
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mv "$(ls build/com.spacesarmat.torrplayer_*_all.ipk)" "build/OMP-${VERSION}-webOS.ipk"
          node scripts/hb-manifest.mjs "$TAG" "build/OMP-${VERSION}-webOS.ipk" "build/OMP-${VERSION}.apk" "build/OMP-${VERSION}-arm64.apk" "build/OMP-${VERSION}-armv7.apk"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          IPK="build/OMP-${VERSION}-webOS.ipk"
          APK="build/OMP-${VERSION}.apk"
          APK64="build/OMP-${VERSION}-arm64.apk"
          APK32="build/OMP-${VERSION}-armv7.apk"
          # short bilingual body: Russian and English changes, downloads, two screenshots; checksums, Homebrew and the
          # compare link folded under «Подробнее». No generated PR list (it repeated every beta).
          node scripts/release-notes.mjs "$TAG" build > notes.md
          # a beta (vX.Y.Z-beta.N) is a pre-release: never «latest», never the Homebrew repository
          EXTRA=""
          case "$TAG" in *-beta.*) EXTRA="--prerelease --latest=false" ;; esac
          gh release create "$TAG" "$IPK" "$APK64" "$APK32" "$APK" "build/hb/com.spacesarmat.torrplayer.manifest.json" --title "OMP $TAG" --notes-file notes.md $EXTRA
      - name: Publish update feed to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh-pages holds every feed: a release replaces them all (the beta ones too), a beta only its two
          git clone -q --depth 1 -b gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" build/pages || mkdir -p build/pages
          case "$TAG" in
            *-beta.*) cp build/hb/update-beta.json build/hb/update-android-beta.json build/pages/ ;;
            *) cp -r build/hb/. build/pages/ ;;
          esac
          cd build/pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Update feed for ${TAG}"
          node "$GITHUB_WORKSPACE/scripts/git-push-retry.mjs"
      # Telegram channel post (skipped without the bot token): photo, caption and buttons only, no files attached (the
      # buttons link every build and the release page). A failure must not fail the release.
      # A stable release whose docs/screenshots/release-<version>/ is in the tag checkout above goes as a photo album.
      - name: Post to Telegram
        # betas are not posted: the channel gets releases only
        if: ${{ !contains(inputs.tag || github.ref_name, '-beta.') }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: |
          node scripts/telegram-post.mjs "$TAG"
