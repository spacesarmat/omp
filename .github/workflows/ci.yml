name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:mobile
      - run: node scripts/package.mjs
      - run: npm run check:boot
      - uses: actions/upload-artifact@v4
        with:
          name: ipk
          path: build/*.ipk

  # the Android app (phone + Android TV): debug build and the Kotlin unit tests, so a broken native side
  # shows up in the pull request and not only when a release is cut
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Sync the web app into the Android project
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run android:sync
      - name: Build and test
        run: (cd android && ./gradlew assembleDebug testDebugUnitTest)
      - name: APK size per ABI
        run: ls -l android/app/build/outputs/apk/debug/*.apk
