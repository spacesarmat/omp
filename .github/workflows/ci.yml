name: CI

on:
  push:
    branches: [main, 'feat/**', 'exp/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: npm test
      - run: npm run build
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - run: npm run build:mobile
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - run: node scripts/package.mjs
      - run: npm run check:boot
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ipk
          path: build/*.ipk

  # the Android app (phone + Android TV): debug build and the Kotlin unit tests, so a broken native side
  # shows up in the pull request and not only when a release is cut
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # android/vendor/2160player (2160 Player's player-core, included build in android/settings.gradle)
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          # 17 for the player-core toolchain (jvmToolchain(17) in the submodule), 21 (last = default) for Gradle
          java-version: |
            17
            21
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - name: Sync the web app into the Android project
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: npm run android:sync
      - name: Build and test
        run: (cd android && ./gradlew -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64 assembleDebug testDebugUnitTest)
      - name: APK size per ABI
        run: ls -l android/app/build/outputs/apk/debug/*.apk
      - name: Upload debug APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error

  # Billing tests run in Node (ops/billing/vitest.config.ts); the jsdom suite cannot load node:sqlite.
  # Admin deps are separate from the server. No path filter: a skipped job reports no status, so this
  # check can be required on pull requests to main. The suite is small, so it runs on every CI event.
  billing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install billing dependencies
        working-directory: ops/billing
        run: npm install
      - name: Install admin dependencies
        working-directory: ops/billing/admin
        run: npm ci
      - name: Billing tests
        working-directory: ops/billing
        run: npm test
      - name: Admin typecheck
        working-directory: ops/billing/admin
        run: npx tsc --noEmit -p tsconfig.app.json && npx tsc --noEmit -p tsconfig.node.json
      - name: Admin build
        working-directory: ops/billing/admin
        run: npm run build
