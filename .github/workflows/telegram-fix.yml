# Fixes an already posted release in the Telegram channel. Run by hand:
#   picture - replace the picture of the post (caption and buttons stay), needs message_id
#   delete  - delete channel messages (ids, e.g. 13 or 9-12 or 9,11)
name: Telegram release fix
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [picture, delete]
        required: true
      tag:
        description: Release tag, e.g. v0.15.0
        required: true
      message_id:
        description: Id of the release post (picture); for an album post, the id of its first photo
        required: false
        default: ''
      ids:
        description: Message ids to delete (delete)
        required: false
        default: ''
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Fix the post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          ACTION: ${{ inputs.action }}
          TAG: ${{ inputs.tag }}
          MESSAGE_ID: ${{ inputs.message_id }}
          IDS: ${{ inputs.ids }}
        run: |
          case "$ACTION" in
            picture) node scripts/telegram-post.mjs "$TAG" --edit-photo "$MESSAGE_ID" ;;
            delete) node scripts/telegram-post.mjs "$TAG" --delete "$IDS" ;;
          esac
